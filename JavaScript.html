        var aksi = editing
          ? '<button class="btn btn-primary btn-sm" data-act="simpan" data-testid="perkembangan-inline-save"><i class="fa fa-save"></i> Simpan</button><button class="btn btn-ghost btn-sm" data-act="batal">Batal</button>'
          : (a.edit ? '<button class="btn btn-ghost btn-sm" data-act="edit" data-testid="perkembangan-edit"><i class="fa fa-pen"></i> Edit</button>' : '') +
            (a.verifikasi && bolehVerifikasiUI() ? '<button class="btn btn-primary btn-sm" data-act="verifikasi" data-testid="perkembangan-verifikasi"><i class="fa fa-clipboard-check"></i> Verifikasi</button>' : '') +
            (a.validasi && bolehValidasiUI() ? '<button class="btn btn-primary btn-sm" data-act="validasi" data-testid="perkembangan-validasi"><i class="fa fa-circle-check"></i> Validasi</button>' : '') +
            (a.hapus ? '<button class="btn btn-ghost btn-sm" data-act="hapus" data-testid="perkembangan-hapus" style="color:#c0392b"><i class="fa fa-trash"></i> Hapus</button>' : '');
        return '<tr data-testid="menu-row" class="rowlink' + (editing ? ' pk-editing' : '') + '" data-id="' + esc(row.id) + '"><td>' + ((d.page - 1) * d.pageSize + i + 1) + '</td>' + tds +
          '<td>' + (row.idPerk ? faskesBadge(row.status) : '—') + '</td><td><div style="display:flex;gap:6px;flex-wrap:nowrap">' + aksi + '</div></td></tr>';
      }).join('');
      b.innerHTML = '<div class="table-wrap"><table class="grid" style="min-width:2600px"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>';
      pkbAutoGrow(b);

      var pr = $('#pk-pager', div), pages = Math.max(1, Math.ceil(d.total / d.pageSize));
      pr.innerHTML = '<span class="pager-info">Menampilkan ' + ((d.page - 1) * d.pageSize + 1) + '–' + Math.min(d.page * d.pageSize, d.total) + ' dari ' + fmt(d.total) + ' data</span>' +
        '<button class="pg" ' + (d.page <= 1 ? 'disabled' : '') + ' data-p="prev"><i class="fa fa-chevron-left"></i></button>' +
        Array.from({ length: Math.min(pages, 7) }, function (_, i) { var n = Math.max(1, Math.min(d.page - 3, pages - 6)) + i; return '<button class="pg ' + (n === d.page ? 'active' : '') + '" data-p="' + n + '">' + n + '</button>'; }).join('') +
        '<button class="pg" ' + (d.page >= pages ? 'disabled' : '') + ' data-p="next"><i class="fa fa-chevron-right"></i></button>' +
        '<select class="mini-select" id="pk-ps"><option>20</option><option>50</option><option>100</option></select><span style="color:var(--ink-soft);font-size:12px">data per halaman</span>';
      $('#pk-ps', div).value = String(st.pageSize);
      $('#pk-ps', div).onchange = function () { st.pageSize = Number($('#pk-ps', div).value); st.page = 1; editId = null; load(); };
      Array.prototype.forEach.call(pr.querySelectorAll('[data-p]'), function (btn) { btn.onclick = function () { var v = btn.getAttribute('data-p'); st.page = v === 'prev' ? d.page - 1 : v === 'next' ? d.page + 1 : Number(v); editId = null; load(); }; });

      Array.prototype.forEach.call(b.querySelectorAll('tr[data-id]'), function (tr) {
        tr.onclick = function (e) {
          var row = byId[tr.getAttribute('data-id')];
          if (!row) return;
          var act = e.target.closest('[data-act]');
          if (!act) {
            if (tr.classList.contains('pk-editing') || e.target.closest('textarea,select,input')) return;
            detailPerkembangan(row); return;
          }
          var a = act.getAttribute('data-act');
          if (a === 'edit') { editId = row.id; gambar(lastD); var f0 = $('tr.pk-editing .pk-ie', b); if (f0) f0.focus(); }
          else if (a === 'batal') { editId = null; gambar(lastD); }
          else if (a === 'simpan') simpanInline(row, tr, act);
          else if (a === 'verifikasi' || a === 'validasi') confirmDlg(a === 'verifikasi' ? 'Verifikasi Perkembangan' : 'Validasi Perkembangan', (a === 'verifikasi' ? 'Verifikasi' : 'Validasi') + ' perkembangan korban <b>' + esc(row.nama) + '</b> (' + esc(row.statusLanjutan || '—') + ')?', function () {
            api(a === 'verifikasi' ? 'verifikasiPerkembangan' : 'validasiPerkembangan', getToken(), row.idPerk).then(function (res) { toast(res.message, res.success ? 'ok' : 'fail'); if (res.success) load(); });
          }, a === 'verifikasi' ? 'Ya, Verifikasi' : 'Ya, Validasi');
          else if (a === 'hapus') confirmDlg('Hapus Perkembangan Korban', 'Catatan perkembangan korban <b>' + esc(row.nama) + '</b> (' + esc(row.statusLanjutan || '—') + ') akan dihapus dan tercatat di log audit. Data korban tidak ikut terhapus. Lanjutkan?', function () {
            api('hapusPerkembangan', getToken(), row.idPerk).then(function (res) { toast(res.message, res.success ? 'ok' : 'fail'); if (res.success) load(); });
          }, 'Hapus');
        };
      });
    }

    function simpanInline(row, tr, btn) {
      var g = function (f) { var n = tr.querySelector('[data-f="' + f + '"]'); return n ? String(n.value || '').trim() : ''; };
      var status = g('statusLanjutan'), tgl = g('tglLanjutan');
      var p = { ID_Korban: row.id, Status_Lanjutan: status, Tgl_Status_Lanjutan: tgl, Version: row.version };
      var adaIsi = false;
      Object.keys(PKB_ISI).forEach(function (k) { var v = g(k); if (v) { p[PKB_ISI[k][0]] = v; adaIsi = true; } });
      if (!status && tgl) { toast('Isi Status Lanjutan terlebih dahulu.', 'fail'); return; }
      if (!status && !adaIsi) { toast('Belum ada isian yang akan disimpan.', 'fail'); return; }
      if (status && !tgl && PKB_WAJIB_TGL.indexOf(status) >= 0) { toast('Tanggal Sembuh/Rujuk/Meninggal wajib diisi untuk status ' + status + '.', 'fail'); return; }
      if (tgl > today()) { toast('Tanggal tidak boleh melewati hari ini.', 'fail'); return; }
      if (tgl && row.tgl && tgl < row.tgl) { toast('Tanggal tidak boleh sebelum Tanggal Kejadian Awal (' + row.tgl + ').', 'fail'); return; }
      btn.disabled = true;
      api('savePerkembangan', getToken(), p, 'req-' + Date.now() + '-' + Math.random().toString(36).slice(2)).then(function (res) {
        btn.disabled = false;
        if (!res.success) { toast(res.message, 'fail'); return; }
        editId = null; toast(res.message, 'ok'); load();
      });
    }

    function load() {
      var p = { search: st.search, dari: st.dari, sampai: st.sampai, idKabupaten: st.kab, status: st.status, page: st.page, pageSize: st.pageSize };
      api('getPerkembangan', getToken(), p).then(function (r) {
        var b = $('#pk-body', div);
        if (!b) return;
        if (!r.success) { b.innerHTML = emptyState(r.message); return; }
        lastD = r.data; opsi = r.data.opsi;
        gambar(lastD);
      });
    }
    window.PKB_MUAT_ULANG = function () { if (document.body.contains(div)) { editId = null; load(); } };

    $('#pk-apply', div).onclick = function () { st.search = $('#pk-q', div).value; st.dari = $('#pk-dari', div).value; st.sampai = $('#pk-sampai', div).value; st.kab = tinggi ? $('#pk-kab', div).value : ''; st.page = 1; editId = null; load(); };
    $('#pk-reset', div).onclick = function () { st.search = ''; st.dari = ''; st.sampai = ''; st.kab = ''; st.status = ''; st.page = 1; editId = null; ['#pk-q', '#pk-dari', '#pk-sampai'].concat(tinggi ? ['#pk-kab'] : []).forEach(function (s) { $(s, div).value = ''; }); load(); };
    $('#pk-q', div).addEventListener('input', debounce(function () { st.search = $('#pk-q', div).value; st.page = 1; editId = null; load(); }, 300));
    $('#pk-add', div).onclick = function () { bukaFormPerkembangan(load); };   // Tambah Data dibuka di halaman baru
    $('#pk-xls', div).onclick = function () {
      api('exportPerkembangan', getToken(), { search: st.search, dari: st.dari, sampai: st.sampai, idKabupaten: st.kab, status: st.status }).then(function (r) {
        if (r.success) { download(r.data.nama, r.data.csv); toast('Berkas Excel (CSV) diunduh.', 'ok'); } else toast(r.message, 'fail');
      });
    };
    $('#pk-pdf', div).onclick = function () { window.print(); };
    load();
    return div;
  }

  function detailPerkembangan(row) {
    var md = modal({ title: 'Detail Perkembangan Korban — ' + row.nama });
    var kv = [['ID Korban', esc(row.id)], ['Sumber Data', row.dariRha ? 'Integrasi Menu RHA' : 'Menu Korban']];
    PKB_KOLOM.forEach(function (c) {
      var x = c[0] === 'usia' ? fmtUsiaKorban(row) : row[c[0]];
      kv.push([c[1], c[0] === 'statusLanjutan' ? pkbBadge(row.statusLanjutan) : esc(pkbKosong(x) ? '—' : x)]);
    });
    if (row.idPerk) kv.push(['Diperbarui', esc(row.diubahPada || '—') + (row.dibuatOleh ? ' (dibuat oleh ' + esc(row.dibuatOleh) + ')' : '')]);
    md.body.innerHTML = '<dl class="kv">' + kv.map(function (x) { return '<dt>' + esc(x[0]) + '</dt><dd>' + x[1] + '</dd>'; }).join('') + '</dl>';
  }

  // ---------- Formulir Tambah Data Perkembangan Korban di halaman (tab) baru ----------
  // Sesi dititipkan sebentar lewat localStorage (pola yang sama dengan formulir Korban dan SDM Kesehatan).
  function bukaFormPerkembangan(onDone) {
    var KEY = 'indakris_handoff';
    try {
      localStorage.setItem(KEY, JSON.stringify({ t: getToken(), u: sessionStorage.getItem('indakris_user'), exp: Date.now() + 120000 }));
      setTimeout(function () { try { localStorage.removeItem(KEY); } catch (e) {} }, 120000);
    } catch (e) {}
    bukaTab('perkembangan', 'TDM', function () {
      try { localStorage.removeItem(KEY); } catch (e) {}
      var md = modal({ title: 'Tambah Data Perkembangan Korban' });
      renderFormPerkembangan(md.body, { onSelesai: function () { md.close(); if (onDone) onDone(); } });   // cadangan bila tab baru diblokir browser
    }, '');
  }

  // Titik masuk di tab baru (?page=form&f=perkembangan)
  function formPerkembanganTab() {
    var host = $('#fp-isi');
    ambilTitipanSesi();
    if (!getToken()) {
      host.innerHTML = '<div class="card" style="padding:20px"><div class="note-info"><i class="fa fa-lock"></i><span>Sesi login tidak ditemukan di tab ini. Tutup halaman ini, login kembali di dashboard, lalu klik <b>Tambah Data</b> lagi.</span></div></div>';
      return;
    }
    renderFormPerkembangan(host, { onSelesai: null });
  }

  // Bagian atas: Tanggal Kejadian Awal (input manual) dan Kabupaten (mengikuti akun; Super/Provinsi memilih).
  // Bagian bawah: satu baris per korban. Pilih korban -> kolom identitas dan klinis terisi otomatis dan hanya baca.
  // Bila korban yang dipilih hasil integrasi RHA, Tanggal Kejadian Awal dan Kabupaten ikut terisi otomatis dan dikunci.
  // Tombol + di samping kolom Tanggal menambah baris perkembangan korban berikutnya.
  function renderFormPerkembangan(host, opts) {
    var tinggi = !!(state.user && (state.user.role === 'SUPER_ADMIN' || state.user.role === 'ADMIN_PROVINSI'));
    var idkAkun = String((state.user && state.user.idKabupaten) || '');
    var top = { tgl: '', kab: tinggi ? '' : idkAkun };
    var kabList = [], kabNama = '', opsi = { statusLanjutan: PKB_STATUS }, cands = [], terpotong = false, items = [], seq = 0, versi = 0;
    window.PKB_KOTOR = false;
    var kotor = function () { window.PKB_KOTOR = true; };
    host.innerHTML = '<div class="card" style="padding:20px"><div class="empty"><i class="fa fa-spinner fa-spin"></i>Memuat formulir...</div></div>';

    function baru() { return { key: ++seq, k: null, status: '', tgl: '', req: null }; }
    function terkunci() { return items.some(function (it) { return it.k && it.k.dariRha; }); }

    function muatKandidat(selesai) {
      var v = ++versi;
      api('getKorbanUntukPerkembangan', getToken(), { tgl: top.tgl, idKabupaten: tinggi ? top.kab : '' }).then(function (r) {
        if (v !== versi) return;
        if (!r || !r.success) { toast((r && r.message) || 'Gagal memuat daftar korban.', 'fail'); cands = []; }
        else { cands = r.data.rows; terpotong = !!r.data.terpotong; if (r.data.opsi) opsi = r.data.opsi; }
        if (selesai) selesai();
      });
    }

    function mulai() {
      var siap = function () { items = [baru()]; muatKandidat(gambar); };
      if (tinggi) api('getKabupatenPublik').then(function (rk) { kabList = rk && rk.success && rk.data && rk.data.kabupaten ? rk.data.kabupaten : []; siap(); });
      else namaKab(idkAkun, function (n) { kabNama = n; siap(); });
    }

    var KUNCI = ' <i class="fa fa-lock" title="Terisi otomatis dan hanya baca" style="font-size:10px;color:var(--ink-soft)"></i>';
    function lbl(t, req, kunci) { return esc(t) + (req ? ' <span class="req">*</span>' : '') + (kunci ? KUNCI : ''); }

    function gambar() {
      var kunciAtas = terkunci();
      var kabHtml = tinggi
        ? '<select id="pf-kab"' + (kunciAtas ? ' disabled' : '') + ' data-testid="field-ID_Kabupaten"><option value="">— Semua / pilih —</option>' + kabList.map(function (k) { return '<option value="' + esc(k.id) + '"' + (String(top.kab) === String(k.id) ? ' selected' : '') + '>' + esc(k.nama) + '</option>'; }).join('') + '</select>'
        : '<select id="pf-kab" disabled data-testid="field-ID_Kabupaten"><option value="' + esc(idkAkun) + '">' + esc(kabNama || 'Sesuai wilayah akun') + '</option></select>';
      host.innerHTML = '<div class="card sdm-card"><div class="card-pad">' +
        '<div class="sdm-sec" style="margin-top:0;border-top:0;padding-top:0"><span>Data Kejadian</span></div>' +
        '<div class="form-grid">' +
        '<div class="field"><label>' + lbl('Tanggal Kejadian Awal', 1, kunciAtas) + '</label><input type="date" id="pf-tgl" value="' + esc(top.tgl) + '" max="' + today() + '"' + (kunciAtas ? ' disabled' : '') + ' data-testid="field-Tgl_Kejadian_Awal">' +
        '<div class="hint">' + (kunciAtas ? 'Terisi otomatis dari data korban hasil integrasi Menu RHA. Kosongkan pilihan korban di bawah untuk mengubahnya.' : 'Isi manual untuk menyaring daftar korban, atau langsung pilih korban di bawah.') + '</div></div>' +
        '<div class="field"><label>' + lbl('Kabupaten / Kota', 0, kunciAtas || !tinggi) + '</label>' + kabHtml + (tinggi ? '' : '<div class="hint">Terkunci sesuai wilayah akun Anda.</div>') + '</div>' +
        '</div>' +
        '<div class="sdm-sec"><span>Data Perkembangan Korban</span></div>' +
        '<div class="note-info" style="margin-top:0"><i class="fa fa-link"></i><span>Kolom bertanda <i class="fa fa-lock"></i> terisi otomatis dari Menu RHA dan Menu Korban dan hanya baca. Isi <b>Status Lanjutan</b> dan <b>Tanggal Sembuh/Rujuk/Meninggal</b>. Klik <b>+</b> untuk menambah baris.</span></div>' +
        (terpotong ? '<div class="hint" style="margin:6px 0">Daftar dibatasi 300 korban pertama. Isi Tanggal Kejadian Awal atau Kabupaten untuk mempersempit.</div>' : '') +
        '<div id="pf-rows"></div></div>' +
        '<div class="sdm-foot"><button class="btn btn-primary" id="pf-simpan" data-testid="perkembangan-save"><i class="fa fa-save"></i> Simpan</button></div></div>';
      var inTgl = $('#pf-tgl', host);
      inTgl.onchange = function () {
        top.tgl = inTgl.value; kotor();
        items.forEach(function (it) { if (it.k && it.k.tgl !== top.tgl) { it.k = null; it.status = ''; it.tgl = ''; } });
        muatKandidat(gambar);
      };
      if (tinggi && !kunciAtas) $('#pf-kab', host).onchange = function () {
        top.kab = $('#pf-kab', host).value; kotor();
        items.forEach(function (it) { if (it.k && top.kab && String(it.k.idKab) !== String(top.kab)) { it.k = null; it.status = ''; it.tgl = ''; } });
        muatKandidat(gambar);
      };
      $('#pf-simpan', host).onclick = simpan;
      gambarBaris();
    }

    function pilihHtml(it) {
      var dipakai = {};
      items.forEach(function (x) { if (x !== it && x.k) dipakai[x.k.id] = 1; });
      var daftar = cands.filter(function (c) { return !dipakai[c.id]; });
      if (it.k && !daftar.some(function (c) { return c.id === it.k.id; })) daftar.unshift(it.k);
      return '<option value="">' + (daftar.length ? '— Pilih korban —' : '— Tidak ada korban untuk filter ini —') + '</option>' + daftar.map(function (c) {
        var t = (c.nama || c.id) + ' — ' + fmtUsiaKorban(c) + (c.statusAwal ? ' — ' + c.statusAwal : '') + (c.tgl ? ' — ' + c.tgl : '') + (c.dariRha ? ' [RHA]' : '') + (c.statusLanjutan ? ' (sudah: ' + c.statusLanjutan + ')' : '');
        return '<option value="' + esc(c.id) + '"' + (it.k && it.k.id === c.id ? ' selected' : '') + '>' + esc(t) + '</option>';
      }).join('');
    }

    function gambarBaris() {
      var box = $('#pf-rows', host);
      box.innerHTML = '';
      items.forEach(function (it, idx) {
        var k = it.k || {};
        var ro = function (cls, v, ta, t) {
          return ta ? '<textarea class="pk-ta pk-ro ' + cls + '" rows="1" readonly placeholder="Otomatis">' + esc(v) + '</textarea>'
            : '<input class="pk-ro ' + cls + '" readonly placeholder="Otomatis" value="' + esc(v) + '">';
        };
        var r = el('<div class="pk-item" data-k="' + it.key + '">' +
          '<div class="pk-item-head"><span>Perkembangan ' + (idx + 1) + '</span>' + (items.length > 1 ? '<button type="button" class="btn btn-ghost btn-sm pk-del" title="Hapus baris ini" aria-label="Hapus baris ini" style="margin-left:auto"><i class="fa fa-trash"></i></button>' : '') + '</div>' +
          '<div class="pk-grid">' +
          '<div class="field pk-span"><label>' + lbl('Pilih Korban', 1) + '</label><select class="pk-pilih" data-testid="field-ID_Korban">' + pilihHtml(it) + '</select></div>' +
          '<div class="field"><label>' + lbl('Nama', 0, 1) + '</label>' + ro('', k.nama || '') + '</div>' +
          '<div class="field"><label>' + lbl('Jenis Kelamin', 0, 1) + '</label>' + ro('', k.jk || '') + '</div>' +
          '<div class="field"><label>' + lbl('Usia', 0, 1) + '</label>' + ro('', it.k ? fmtUsiaKorban(k) : '') + '</div>' +
          '<div class="field"><label>' + lbl('Kategori Usia', 0, 1) + '</label>' + ro('', k.kategori || '') + '</div>' +
          '<div class="field"><label>' + lbl('Status Awal', 0, 1) + '</label>' + ro('', k.statusAwal || '') + '</div>' +
          '<div class="field"><label>' + lbl('Diagnosa/Keterangan', 0, 1) + '</label>' + ro('', k.diagnosa || '', 1) + '</div>' +
          '<div class="field"><label>' + lbl('Alamat', 0, 1) + '</label>' + ro('', k.alamat || '', 1) + '</div>' +
          '<div class="field"><label>' + lbl('Kecamatan', 0, 1) + '</label>' + ro('', k.kecamatan || '', 1) + '</div>' +
          '<div class="field"><label>' + lbl('Lokasi Kejadian', 0, 1) + '</label>' + ro('', k.lokasiKejadian || '', 1) + '</div>' +
          '<div class="field"><label>' + lbl('Lokasi Perawatan', 0, 1) + '</label>' + ro('', k.lokasiPerawatan || '', 1) + '</div>' +
          '<div class="field"><label>' + lbl('Rujukan', 0, 1) + '</label>' + ro('', k.rujukan || '') + '</div>' +
          '<div class="field"><label>' + lbl('Kewarganegaraan', 0, 1) + '</label>' + ro('', k.wn || '') + '</div>' +
          '<div class="field"><label>' + lbl('Status Lanjutan', 1) + '</label><select class="pk-status" data-testid="field-Status_Lanjutan">' + opsiKorbanHtml(opsi.statusLanjutan || PKB_STATUS, it.status, '— Pilih —') + '</select></div>' +
          '<div class="field"><label>' + lbl('Tanggal Sembuh/Rujuk/Meninggal', 0) + '</label><div class="pk-tgl-in"><input type="date" class="pk-tgl" max="' + today() + '" value="' + esc(it.tgl) + '" data-testid="field-Tgl_Status_Lanjutan">' +
          '<button type="button" class="btn btn-add btn-sm pk-plus" title="Tambah baris perkembangan korban" aria-label="Tambah baris perkembangan korban"><i class="fa fa-plus"></i></button></div>' +
          '<div class="hint pk-hint-tgl"></div></div>' +
          '</div></div>');
        box.appendChild(r);
        var q = function (s) { return $(s, r); };
        var sel = q('.pk-pilih'), st = q('.pk-status'), tg = q('.pk-tgl'), hint = q('.pk-hint-tgl');
        function petunjuk() { hint.textContent = PKB_WAJIB_TGL.indexOf(it.status) >= 0 ? 'Wajib diisi untuk status ' + it.status + '.' : ''; }
        petunjuk();
        sel.addEventListener('change', function () {
          var c = cands.filter(function (x) { return x.id === sel.value; })[0] || (it.k && it.k.id === sel.value ? it.k : null);
          it.k = c || null;
          it.status = c ? (c.statusLanjutan || '') : '';
          it.tgl = c ? (c.tglLanjutan || '') : '';
          kotor();
          if (c && c.dariRha) { top.tgl = c.tgl || top.tgl; if (c.idKab) top.kab = c.idKab; muatKandidat(gambar); }   // integrasi RHA: bagian atas terisi otomatis dan dikunci; daftar korban disesuaikan
          else gambar();
        });
        st.addEventListener('change', function () { it.status = st.value; petunjuk(); kotor(); });
        tg.addEventListener('change', function () { it.tgl = tg.value; kotor(); });
        q('.pk-plus').onclick = function () {
          items.splice(items.indexOf(it) + 1, 0, baru()); gambarBaris();
          var rs = $('#pf-rows', host).querySelectorAll('.pk-item'), n = rs[items.indexOf(it) + 1];
          if (n) { var f = $('.pk-pilih', n); if (f) f.focus(); }
        };
        var bd = q('.pk-del');
        if (bd) bd.onclick = function () {
          var kunciLama = terkunci();
          items.splice(items.indexOf(it), 1); kotor();
          if (kunciLama && !terkunci()) gambar(); else gambarBaris();
        };
      });
      pkbAutoGrow(box);
    }

    function cek() {
      for (var i = 0; i < items.length; i++) {
        var it = items[i], lb = items.length > 1 ? ' (baris ' + (i + 1) + ')' : '';
        if (!it.k) return 'Pilih korban terlebih dahulu' + lb + '.';
        if (!it.status) return 'Status Lanjutan wajib diisi' + lb + '.';
        if (PKB_WAJIB_TGL.indexOf(it.status) >= 0 && !it.tgl) return 'Tanggal Sembuh/Rujuk/Meninggal wajib diisi untuk status ' + it.status + lb + '.';
        if (it.tgl > today()) return 'Tanggal tidak boleh melewati hari ini' + lb + '.';
        if (it.tgl && it.k.tgl && it.tgl < it.k.tgl) return 'Tanggal tidak boleh sebelum Tanggal Kejadian Awal korban (' + it.k.tgl + ')' + lb + '.';
      }
      return '';
    }

    function selesai(n) {
      window.PKB_KOTOR = false;
      try { localStorage.setItem('indakris_pkb_ping', String(Date.now())); } catch (e) {}
      var keluar = opts.onSelesai || tutupHalaman;
      host.innerHTML = '<div class="card" id="fp-selesai" style="padding:28px;text-align:center"><div style="font-size:44px;color:var(--green)"><i class="fa fa-circle-check"></i></div>' +
        '<div class="card-title" style="margin:8px 0">Data tersimpan</div><p style="color:var(--ink-soft)">' + esc(n + ' data perkembangan korban berhasil disimpan dan tampil pada tabel Menu Perkembangan Korban.') + '</p>' +
        '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn btn-primary" id="pf-lagi"><i class="fa fa-rotate-right"></i> Tambah Data Lagi</button>' +
        '<button class="btn btn-ghost" id="pf-tutup">' + (opts.onSelesai ? 'Tutup' : 'Tutup Halaman') + '</button></div></div>';
      $('#pf-lagi', host).onclick = function () { top = { tgl: '', kab: tinggi ? '' : idkAkun }; items = [baru()]; muatKandidat(gambar); };
      $('#pf-tutup', host).onclick = keluar;
    }

    function simpan() {
      var err = cek();
      if (err) { toast(err, 'fail'); return; }
      var b = $('#pf-simpan', host); b.disabled = true;
      var bukaTombol = function () { var x = $('#pf-simpan', host); if (x) x.disabled = false; };
      var berhasil = 0, total = items.length;
      (function kirim() {
        var it = items[0];
        if (!it) { selesai(berhasil); return; }
        if (!it.req) it.req = 'req-' + Date.now() + '-' + Math.random().toString(36).slice(2);   // ID permintaan tetap per baris: kirim ulang tidak menggandakan data
        api('savePerkembangan', getToken(), { ID_Korban: it.k.id, Status_Lanjutan: it.status, Tgl_Status_Lanjutan: it.tgl, Version: it.k.version }, it.req).then(function (res) {
          if (!res || !res.success) {
            toast((res && res.message ? res.message : 'Gagal menyimpan.') + (berhasil ? ' ' + berhasil + ' dari ' + total + ' baris sudah tersimpan; sisanya masih di formulir.' : ''), 'fail');
            gambar(); bukaTombol(); return;
          }
          berhasil++; items.shift(); kirim();
        });
      })();
    }

    mulai();
  }

  function ambilTitipanSesi() {

          var ls = sdmSpes(it.kat, it.jenis);
          if (it.spes && ls.indexOf(it.spes) < 0) it.spes = '';
          sS.innerHTML = opsiHtml(ls, it.spes, it.jenis ? '— Pilih —' : '— Pilih Jenis dulu —'); sS.disabled = !it.jenis;
        }
        sK.innerHTML = opsiHtml(['Nakes', 'Non Nakes'], it.kat, '— Pilih —');
        isiJenis(); isiSpes();
        sK.onchange = function () { it.kat = sK.value; it.jenis = ''; it.spes = ''; isiJenis(); isiSpes(); window.SDM_KOTOR = true; };
        sJ.onchange = function () { it.jenis = sJ.value; it.spes = ''; isiSpes(); window.SDM_KOTOR = true; };
        sS.onchange = function () { it.spes = sS.value; window.SDM_KOTOR = true; };
        nJ.oninput = function () { it.jml = nJ.value; window.SDM_KOTOR = true; };
        var p = $('.sd-plus', r), d = $('.sd-del', r);
        if (p) p.onclick = function () { items.splice(items.indexOf(it) + 1, 0, baruItem()); gambarBaris(); var rs = $('#sd-rows').querySelectorAll('.sdm-row'); var n = rs[items.indexOf(it) + 1]; if (n) { var f = $('.sd-kat', n); if (f) f.focus(); } };
        if (d) d.onclick = function () { items.splice(items.indexOf(it), 1); gambarBaris(); window.SDM_KOTOR = true; };
        box.appendChild(r);
      });
    }

    function cek() {
      var tgl = $('#sd-tgl').value, fk = $('#sd-fk').value.replace(/\s+/g, ' ').trim();
      if (!tgl) return 'Kolom wajib belum diisi: Tanggal';
      if (tgl > today()) return 'Tanggal tidak boleh melewati hari ini.';
      if (!fk) return 'Kolom wajib belum diisi: Nama Faskes';
      if (tinggi && !$('#sd-kab').value) return 'Kolom wajib belum diisi: Kabupaten/Kota';
      var seen = {};
      for (var i = 0; i < items.length; i++) {
        var it = items[i], n = i + 1, lbl = items.length > 1 ? ' (baris ' + n + ')' : '';
        if (!it.kat) return 'Kategori wajib dipilih' + lbl + '.';
        if (!it.jenis) return 'Jenis wajib dipilih' + lbl + '.';
        if (!it.spes) return 'Spesifikasi wajib dipilih' + lbl + '.';
        if (!/^\d{1,6}$/.test(String(it.jml).trim()) || Number(it.jml) < 1) return 'Jumlah harus bilangan bulat minimal 1' + lbl + '.';
        var k = it.kat + '|' + it.jenis + '|' + it.spes;
        if (seen[k]) return 'Baris ' + seen[k] + ' dan ' + n + ' memiliki Kategori, Jenis, dan Spesifikasi yang sama. Gabungkan jumlahnya dalam satu baris.';
        seen[k] = n;
      }
      return '';
    }

    function simpan(flag) {
      var err = cek();
      if (err) { toast(err, 'fail'); return; }
      var tgl = $('#sd-tgl').value, fk = $('#sd-fk').value.replace(/\s+/g, ' ').trim();
      var bs = [$('#sd-draft'), $('#sd-ajukan')]; bs.forEach(function (b) { b.disabled = true; });
      var berhasil = 0, total = items.length;
      function bukaTombol() { bs.forEach(function (b) { if (b) b.disabled = false; }); }
      function payloadDari(it) {
        var p = { Tanggal: tgl, Nama_Faskes: fk, Kategori: it.kat, Jenis: it.jenis, Spesifikasi: it.spes, Jumlah: String(Number(it.jml)) };
        if (tinggi) { var kv = $('#sd-kab').value; p.ID_Kabupaten = kv === 'PROV' ? '' : kv; }
        return p;
      }

      if (id) {   // mode ubah: satu data
        var it0 = items[0];
        api('updateMenuData', getToken(), KODE, id, payloadDari(it0), row ? row.Version : 1).then(function (res) {
          if (!res || !res.success) { toast((res && res.message) || 'Gagal menyimpan.', 'fail'); bukaTombol(); return; }
          selesai(1, res.message);
        });
        return;
      }
      (function kirim() {
        var it = items[0];
        if (!it) { selesai(berhasil); return; }
        if (!it.req) it.req = 'req-' + Date.now() + '-' + Math.random().toString(36).slice(2);   // ID permintaan tetap per baris agar kirim ulang tidak menggandakan data
        api('saveMenuData', getToken(), KODE, payloadDari(it), it.req, flag).then(function (res) {
          if (!res || !res.success) {
            toast((res && res.message ? res.message : 'Gagal menyimpan.') + (berhasil ? ' ' + berhasil + ' dari ' + total + ' baris sudah tersimpan; sisanya masih di formulir.' : ''), 'fail');
            gambarBaris(); bukaTombol(); return;
          }
          berhasil++; items.shift(); kirim();
        });
      })();
    }

    function selesai(n, pesan) {
      window.SDM_KOTOR = false;
      host.innerHTML = '<div class="card" id="fp-selesai" style="padding:28px;text-align:center"><div style="font-size:44px;color:var(--green)"><i class="fa fa-circle-check"></i></div>' +
        '<div class="card-title" style="margin:8px 0">Data tersimpan</div><p style="color:var(--ink-soft)">' + esc(pesan || (n + ' baris data SDM Kesehatan berhasil disimpan.')) + '</p>' +
        '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">' + (id ? '' : '<button class="btn btn-primary" id="sd-lagi"><i class="fa fa-rotate-right"></i> Tambah Data Lagi</button>') + '<button class="btn btn-ghost" id="sd-tutup">Tutup Halaman</button></div></div>';
      var lagi = $('#sd-lagi'); if (lagi) lagi.onclick = function () { row = null; items = [baruItem()]; gambar(); };
      $('#sd-tutup').onclick = tutupHalaman;
    }
    muat();
  }

  function render() {
    var hash = location.hash || '#/';
    var parts = hash.replace(/^#\//, '').split('/');
    var priv = state.user && getToken();
    var app = document.getElementById('app');
    app.innerHTML = '';
    document.querySelectorAll('.modal-back').forEach(function (m) { m.remove(); });

    if (parts[0] === 'login') { app.appendChild(pageLogin()); return; }
    if (parts[0] === 'daftar') { app.appendChild(pageDaftar()); return; }
    if (parts[0] === 'cek-status') { app.appendChild(pageCekStatus()); return; }
    if (parts[0] === 'lupa') { app.appendChild(pageLupa()); return; }

    if (parts[0] === 'app') {
      if (!priv) { location.hash = '#/login'; return; }
      shell(el('<div></div>'));
      var p = $('#page');
      var bolehAkses = !parts[1] || parts[1] === 'emt' || parts[1] === 'tdp' || (parts[1] === 'verifikasi-rha' ? state.user.role === 'SUPER_ADMIN' : (state.menu || []).some(function (m) { return parts[1] === 'menu' ? m.kode === parts[2] && !m.custom : m.custom === parts[1]; }));
      if (!bolehAkses) { p.appendChild(el('<div class="card" data-testid="access-denied">' + emptyState('Anda tidak memiliki akses ke halaman ini.') + '</div>')); highlightNav(); return; }
      if (parts[1] === 'menu' && parts[2]) p.appendChild(parts[2] === 'M25' ? pageKorban() : parts[2] === 'M26' ? pagePerkembangan() : parts[2] === 'M02' ? pageFaskes() : parts[2] === 'M03' ? pagePenilaian() : pageMenu(parts[2]));
      else if (parts[1] === 'users') p.appendChild(pageUsers());
      else if (parts[1] === 'verifikasi-rha') p.appendChild(pageVerifikasiRHA());
      else if (parts[1] === 'audit') p.appendChild(pageAudit());
      else if (parts[1] === 'config') p.appendChild(pageConfig());
      else if (parts[1] === 'master') p.appendChild(pageMaster());
      else if (parts[1] === 'arsip') p.appendChild(pageArsip());
      else if (parts[1] === 'emt') p.appendChild(pageEmt('TDM'));
      else if (parts[1] === 'tdp') p.appendChild(pageEmt('TDP'));
      else p.appendChild(pageAppDashboard());
      highlightNav();
      return;
    }

    shell(el('<div></div>'));
    var p2 = $('#page');
    if (parts[0] === 'wilayah' && parts[1]) p2.appendChild(pageWilayah(parts[1]));
    else if (parts[0] === 'laporan-rha') p2.appendChild(pageRHA());
    else if (parts[0] === 'tim-darurat-medis') p2.appendChild(pageTim('TDM'));
    else if (parts[0] === 'tim-dukungan-psikososial') p2.appendChild(pageTim('TDP'));
    else if (parts[0] === 'infografis') p2.appendChild(pageInfografis());
    else p2.appendChild(pageDashboardPublik());
    highlightNav();
  }
  function highlightNav() {
    var hash = location.hash || '#/';
    Array.prototype.forEach.call(document.querySelectorAll('.side-item'), function (n) {
      var h = n.getAttribute('data-href');
      n.classList.toggle('active', h === hash || (h === '#/' && (hash === '' || hash === '#/')));
    });
    document.title = 'INDAKRIS NTT — Informasi Data Krisis Kesehatan';
  }

  // Cadangan bila Index.html/doGet tidak mengisi INDAKRIS_FORM: baca ?page=form&f=...&m=... dari alamat tab
  function bacaParamForm(cb) {
    if (window.INDAKRIS_FORM) { cb(); return; }
    var selesai = false, fin = function () { if (!selesai) { selesai = true; cb(); } };
    try {
      google.script.url.getLocation(function (loc) {
        var q = (loc && loc.parameter) || {};
        if (q.page === 'form' && ['rha', 'kedatangan', 'harian', 'kepulangan', 'lihat', 'verifikasi', 'sdm', 'korban', 'perkembangan', 'faskes', 'menu'].indexOf(q.f) >= 0) { window.INDAKRIS_FORM = q.f; if (q.f === 'menu' && /^M\d{2}$/.test(String(q.k || ''))) window.INDAKRIS_KODE = q.k; window.INDAKRIS_MOD = q.m === 'TDP' ? 'TDP' : 'TDM'; if (q.f === 'sdm' && q.id && /^[A-Za-z0-9_-]{1,60}$/.test(q.id)) window.INDAKRIS_ID = q.id; }
        fin();
      });
      setTimeout(fin, 1500);
    } catch (e) { fin(); }
  }
  // Alamat dasar aplikasi untuk membuka tab baru (dipakai bila Index.html tidak mengisi INDAKRIS_BASE)
  function siapkanBaseUrl() {
    if (window.INDAKRIS_BASE || window.INDAKRIS_FORM) return;
    api('getBaseUrlApp').then(function (r) { if (r && r.success && r.data) window.INDAKRIS_BASE = String(r.data); });
  }
  function boot() { bacaParamForm(mulai); }
  function mulai() {
    siapkanBaseUrl();
    if (window.INDAKRIS_FORM) { halamanForm(window.INDAKRIS_FORM, window.INDAKRIS_MOD || 'TDM'); return; }
    setToken(getToken());
    try { var u = sessionStorage.getItem('indakris_user'); if (u) setUser(JSON.parse(u)); } catch (e) {}
    if (state.user && getToken()) {
      api('bootstrapPrivate', getToken()).then(function (r) {
        if (r.success) { state.user = r.data.user; state.menu = r.data.menu; state.pending = r.data.pending; }
        else { setToken(null); setUser(null); }
        render(); refreshPendRHA();
      });
    } else render();
    window.addEventListener('hashchange', render);
  }
  boot();
})();
</script>
