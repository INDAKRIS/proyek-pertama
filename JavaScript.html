<script>
  var JENIS_BENCANA_BARU = ['Banjir', 'Letusan Gunung Berapi', 'Gempa Bumi', 'Gempa Bumi & Tsunami', 'Tanah Longsor', 'Banjir Bandang', 'Kekeringan', 'Angin Puting Beliung', 'Gelombang Pasang/Badai', 'Banjir dan Tanah Longsor', 'Tsunami', 'Tersambar Petir', 'Semburan Lumpur/Gas', 'Kebakaran', 'Kebakaran Hutan dan Lahan', 'Kecelakaan Transportasi Darat', 'Kecelakaan Transportasi Laut-Udara', 'Kecelakaan Industri', 'Kejadian Luar Biasa (KLB) - Penyakit', 'Kejadian Luar Biasa (KLB) - Keracunan', 'Gagal Teknologi', 'Wabah Penyakit (Epidemi - Pandemi)', 'Konflik Sosial atau Kerusuhan Sosial', 'Aksi Teror dan Sabotase'];

/* JavaScript.html — SPA INDAKRIS NTT (publik + privat) */
(function () {
  'use strict';

  // ============ Util dasar ============
  function $(s, r) { return (r || document).querySelector(s); }
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n) { if (n === '' || n === null || n === undefined) return null; var x = Number(n); if (isNaN(x)) return null; return x.toLocaleString('id-ID'); }
  function disp(n) { var v = fmt(n); return v === null ? '—' : v; }
  function debounce(fn, ms) { var t; return function () { var a = arguments, c = this; clearTimeout(t); t = setTimeout(function () { fn.apply(c, a); }, ms || 300); }; }
  function el(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function nowStr() { var d = new Date(); var hari = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'][d.getDay()]; var bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'][d.getMonth()]; return hari + ', ' + String(d.getDate()).padStart(2, '0') + ' ' + bulan + ' ' + d.getFullYear() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ' WITA'; }
  function deviceToken() { try { var t = localStorage.getItem('indakris_device'); if (!t) { t = 'dev-' + Date.now() + '-' + Math.random().toString(36).slice(2); localStorage.setItem('indakris_device', t); } return t; } catch (e) { return 'dev-umum'; } }

  // Konstanta status data (salinan sisi-klien dari Config.gs; variabel server tidak tersedia di browser)
  var STATUS_DATA = { DRAFT: 'Draft', DIAJUKAN: 'Diajukan', TERVERIFIKASI: 'Terverifikasi', TERVALIDASI: 'Tervalidasi', DIKEMBALIKAN: 'Dikembalikan' };
  var ROLE_LABEL = { ADMIN_POSKO: 'Admin Posko Kesehatan', ADMIN_PUSKESMAS: 'Admin Puskesmas', ADMIN_KABUPATEN: 'Admin Kabupaten', ADMIN_PROVINSI: 'Admin Provinsi', SUPER_ADMIN: 'Super Admin' };
  var state = { token: null, user: null, menu: null, pending: null, kabList: null, pubFilter: { tahun: '', jenis: '' }, kabPage: 1, kabSearch: '', region: {}, menuPage: {}, bootDone: false };

  function getToken() { try { return sessionStorage.getItem('indakris_token'); } catch (e) { return state.token; } }
  function setToken(t) { state.token = t; try { if (t) sessionStorage.setItem('indakris_token', t); else sessionStorage.removeItem('indakris_token'); } catch (e) {} }
  function setUser(u) { state.user = u; try { if (u) sessionStorage.setItem('indakris_user', JSON.stringify(u)); else sessionStorage.removeItem('indakris_user'); } catch (e) {} }

  // ============ API ============
  function gsr(fn, args) {
    return new Promise(function (res, rej) {
      var runner = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { rej(e); });
      runner[fn].apply(runner, args);
    });
  }
  function api(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    var p;
    if (window.MOCK && window.MOCK[fn]) p = Promise.resolve().then(function () { return window.MOCK[fn].apply(null, args); });
    else p = gsr(fn, args);
    return p.catch(function (e) { return { success: false, message: 'Gagal menghubungi server: ' + ((e && e.message) || e || 'periksa koneksi internet') }; }).then(function (r) {
      if (r === null || r === undefined) return { success: false, message: 'Server tidak mengembalikan data. Periksa menu Executions di Apps Script.' };
      if (r && r.success === false && r.code === 'SESI') { setToken(null); setUser(null); if (window.INDAKRIS_FORM) return r; render(); sesiModal(); throw r; }
      return r;
    });
  }

  function refreshPendRHA() {
    if (!state.user || state.user.role !== 'SUPER_ADMIN') return;
    api('getAntreanVerifikasiRHA', getToken(), {}).then(function (r) {
      state.pendRHA = r.success ? (r.data.total || '') : '';
      var n = document.querySelector('[data-testid=nav-verifikasi-rha]');
      if (!n) return;
      var bd = n.querySelector('.side-badge');
      if (state.pendRHA && !bd) n.appendChild(el('<span class="side-badge" data-testid="side-badge-rha">' + state.pendRHA + '</span>'));
      else if (bd) { if (state.pendRHA) bd.textContent = state.pendRHA; else bd.remove(); }
    });
  }
  function go(h) { if (location.hash === h) render(); else location.hash = h; }
  function namaKab(id, cb) {
    if (!id) { cb('Provinsi NTT'); return; }
    if (state.kabNames) { cb(state.kabNames[id] || id); return; }
    api('getKabupatenPublik').then(function (r) {
      state.kabNames = {};
      if (r.success) r.data.kabupaten.forEach(function (k) { state.kabNames[k.id] = k.nama; });
      cb(state.kabNames[id] || id);
    });
  }
  // Tautan <a href="#/..."> dialihkan ke location.hash. Tanpa ini, <base target="_top"> di Index.html membuat
  // browser membuka halaman induk Apps Script ke alamat iframe, sehingga Lupa Password, Buat Akun Baru,
  // Cek Status Pendaftaran, dan tautan kembali tidak berfungsi.
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a || e.defaultPrevented || e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return;
    e.preventDefault();
    var h = a.getAttribute('href');
    if (location.hash === h) render(); else location.hash = h;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var all = document.querySelectorAll('.modal-back:not([data-locked])');
    if (all.length) all[all.length - 1].remove();
  });

  // ============ Toast & modal ============
  function toast(msg, type) {
    var t = el('<div class="toast ' + (type || '') + '">' + esc(msg) + '</div>');
    $('#toast-area').appendChild(t);
    setTimeout(function () { t.style.opacity = '0'; t.style.transition = 'opacity .4s'; setTimeout(function () { t.remove(); }, 400); }, 4200);
  }
  function modal(opts) {
    var back = el('<div class="modal-back"' + (opts.locked ? ' data-locked="1"' : '') + '></div>');
    var m = el('<div class="modal ' + (opts.narrow ? 'narrow' : '') + '">' +
      '<div class="modal-head"><div class="modal-title">' + esc(opts.title || '') + '</div><div style="margin-left:auto"><button class="icon-btn" data-x data-testid="modal-close"' + (opts.locked ? ' hidden' : '') + '><i class="fa fa-xmark"></i></button></div></div>' +
      '<div class="modal-body"></div>' + (opts.foot !== false ? '<div class="modal-foot"></div>' : '') + '</div>');
    back.appendChild(m);
    if (window.INDAKRIS_FORM) Array.prototype.forEach.call(document.querySelectorAll('.modal-back'), function (m) { m.style.display = 'none'; });
    document.getElementById('modal-root').appendChild(back);
    function close() {
      back.remove();
      if (window.INDAKRIS_FORM) {
        var sisa = document.querySelectorAll('.modal-back'); if (sisa.length) sisa[sisa.length - 1].style.display = '';
        setTimeout(cekSelesaiHalaman, 60);
      }
    }
    back.addEventListener('click', function (e) { if (e.target === back && !opts.locked) close(); });
    $('[data-x]', m).onclick = function () { if (!opts.locked) close(); };
    return { el: m, body: $('.modal-body', m), foot: $('.modal-foot', m), close: close };
  }
  function confirmDlg(title, msg, onOk, okLabel) {
    var md = modal({ title: title, narrow: true });
    md.body.innerHTML = '<div style="line-height:1.6">' + msg + '</div>';
    var bOk = el('<button class="btn btn-primary"><i class="fa fa-check"></i> ' + esc(okLabel || 'Ya, Lanjutkan') + '</button>');
    var bNo = el('<button class="btn btn-ghost">Batal</button>');
    bOk.onclick = function () { md.close(); onOk(); };
    bNo.onclick = md.close;
    md.foot.appendChild(bNo); md.foot.appendChild(bOk);
  }

  // ============ Komponen ============
  function kpi(icon, color, num, label, sub) {
    return el('<div class="kpi" data-testid="kpi-card"><div class="kpi-ic" style="background:' + color + '"><i class="fa ' + icon + '"></i></div>' +
      '<div><div class="kpi-num" data-testid="kpi-value">' + esc(num) + '</div><div class="kpi-lbl">' + esc(label) + (sub ? ' <b>' + esc(sub) + '</b>' : '') + '</div></div></div>');
  }
  function badge(status) {
    var cls = { 'Draft': 'badge-draft', 'Diajukan': 'badge-diajukan', 'Terverifikasi': 'badge-terverifikasi', 'Tervalidasi': 'badge-tervalidasi', 'Dikembalikan': 'badge-dikembalikan', 'VERIFIED': 'badge-verified', 'DRAFT': 'badge-draft', 'Normal': 'badge-normal', 'Siaga': 'badge-siaga', 'Disetujui': 'badge-tervalidasi', 'Menunggu': 'badge-diajukan', 'Ditolak': 'badge-dikembalikan' }[status] || 'badge-info';
    return '<span class="badge ' + cls + '">' + esc(status || '—') + '</span>';
  }
  function hBar(items, unit) {
    if (!items.length) return '<div class="empty"><i class="fa fa-chart-simple"></i>Belum ada data.</div>';
    var max = Math.max.apply(null, items.map(function (i) { return i.nilai; })) || 1;
    return items.map(function (it) {
      return '<div class="bar-h-row"><div class="bar-h-label" title="' + esc(it.label) + '">' + esc(it.label) + '</div>' +
        '<div class="bar-h-track"><div class="bar-h-fill" style="width:' + Math.max(3, Math.round(it.nilai / max * 100)) + '%"></div></div>' +
        '<div class="bar-h-val">' + disp(it.nilai) + '</div></div>';
    }).join('');
  }
  function vBar(items, cls) {
    if (!items.length) return '<div class="empty"><i class="fa fa-chart-column"></i>Belum ada data.</div>';
    var max = Math.max.apply(null, items.map(function (i) { return i.nilai; })) || 1;
    return '<div class="vbar-wrap">' + items.map(function (it) {
      return '<div class="vbar-col"><div class="vbar-val">' + disp(it.nilai) + '</div><div class="vbar-track"><div class="vbar-fill ' + (cls || '') + '" style="height:' + Math.max(2, Math.round(it.nilai / max * 100)) + '%"></div></div><div class="vbar-lbl" title="' + esc(it.label) + '">' + esc(it.label) + '</div></div>';
    }).join('') + '</div>';
  }
  function chartCard(title, sub, inner, right) {
    return el('<div class="card"><div class="card-head"><div><div class="card-title">' + esc(title) + '</div>' + (sub ? '<div class="card-sub">' + esc(sub) + '</div>' : '') + '</div><div class="spacer"></div>' + (right || '') + '</div><div class="card-pad" data-testid="chart-area">' + inner + '</div></div>');
  }
  function emptyState(msg) { return '<div class="empty"><i class="fa fa-inbox"></i>' + esc(msg) + '</div>'; }
  function copyBtn(text) {
    return el('<button class="icon-btn" title="Salin" data-testid="copy-button"><i class="fa fa-copy"></i></button>');
  }
  function copyText(t) {
    try { navigator.clipboard.writeText(t).then(function () { toast('Berhasil disalin.', 'ok'); }); }
    catch (e) { toast('Tidak dapat menyalin otomatis.', 'fail'); }
  }
  function download(name, content, mime) {
    var b = new Blob(['\uFEFF' + content], { type: mime || 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = name; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 800);
  }

  // ============ Kerangka shell ============
  // Ikon sidebar per kode menu (Font Awesome 6 Free, solid). Warna mengikuti warna teks sidebar (currentColor).
  var ICON_MENU = {
    M25: 'fa-user-injured', M26: 'fa-heart-pulse', M01: 'fa-people-roof', M04: 'fa-user-doctor',
    M02: 'fa-hospital', M03: 'fa-house-chimney-crack',
    M05: 'fa-bullseye', M06: 'fa-stethoscope', M07: 'fa-virus', M11: 'fa-bowl-food', M21: 'fa-magnifying-glass-chart',
    M08: 'fa-faucet-drip', M09: 'fa-baby', M10: 'fa-brain', M12: 'fa-bullhorn', M13: 'fa-fingerprint', M24: 'fa-people-group',
    M14: 'fa-file-signature', M15: 'fa-list-check', M16: 'fa-truck-ramp-box', M17: 'fa-boxes-packing',
    M18: 'fa-dolly', M19: 'fa-box-open', M20: 'fa-warehouse',
    M22: 'fa-calendar-day', M23: 'fa-file-lines'
  };
  (function sidebarIconStyle() {
    if (document.getElementById('side-icon-style')) return;
    var st = document.createElement('style');
    st.id = 'side-icon-style';
    var T = { P: ['#1273b9', '#e1f0fb'], A: ['#e5584f', '#fdeceb'], B: ['#1b8fe3', '#e2f1fd'], C: ['#14a3a3', '#ddf5f4'], D: ['#7c5cdb', '#eee9fc'], E: ['#e8863a', '#fdefe0'], F: ['#10b580', '#dcf7ee'], S: ['#52708a', '#e6eef5'] };
    var c = '.app-shell .sidebar .side-item{--tc:#1273b9;--tb:#e1f0fb}' +
      '.app-shell .sidebar .side-item>i:first-child{display:inline-flex;align-items:center;justify-content:center;flex:0 0 32px;width:32px;height:32px;font-size:14px;line-height:1;border-radius:10px;color:var(--tc);background:var(--tb);transition:background .18s,color .18s,box-shadow .18s,transform .18s}' +
      '.app-shell .sidebar .side-item:hover>i:first-child{background:var(--tc);background:linear-gradient(135deg,var(--tc),color-mix(in srgb,var(--tc) 72%,#0b3a5e));color:#fff;transform:scale(1.06)}' +
      '.app-shell .sidebar .side-item.active{background:var(--tb);box-shadow:inset 3px 0 0 var(--tc)}' +
      '.app-shell .sidebar .side-item.active>i:first-child{background:var(--tc);background:linear-gradient(135deg,var(--tc),color-mix(in srgb,var(--tc) 72%,#0b3a5e));color:#fff;box-shadow:0 4px 10px rgba(11,74,122,.22)}';
    Object.keys(T).forEach(function (k) { c += '.app-shell .sidebar .side-item.t-' + k + '{--tc:' + T[k][0] + ';--tb:' + T[k][1] + '}'; });
    st.textContent = c;
    document.head.appendChild(st);
  })();
  var PUB_MENU = [
    { href: '#/', icon: 'fa-chart-line', tone: 'P', nama: 'Dashboard Publik', testid: 'nav-dashboard-publik' },
    { href: '#/laporan-rha', icon: 'fa-file-circle-exclamation', tone: 'A', nama: 'Laporan RHA', testid: 'nav-laporan-rha' },
    { href: '#/tim-darurat-medis', icon: 'fa-truck-medical', tone: 'B', nama: 'Tim Darurat Medis', testid: 'nav-tim-darurat-medis' },
    { href: '#/tim-dukungan-psikososial', icon: 'fa-hand-holding-heart', tone: 'D', nama: 'Tim Dukungan Psikososial', testid: 'nav-tim-dukungan-psikososial' },
    { href: '#/infografis', icon: 'fa-chart-pie', tone: 'E', nama: 'Infografis', testid: 'nav-infografis' }
  ];
  var KLUSTER_LABEL = { A: 'KLUSTER A \u2014 KORBAN, PENGUNGSI & NAKES', B: 'KLUSTER B \u2014 FASKES', C: 'KLUSTER C \u2014 PELAYANAN & SURVEILANS', D: 'KLUSTER D \u2014 LINGKUNGAN, JIWA & RELAWAN', E: 'KLUSTER E \u2014 LOGISTIK', F: 'KLUSTER F \u2014 REKAP' };
  // Susunan menu sidebar Dashboard Private (urutan kode menu per kluster); tidak bergantung pada field 'kluster' di Config.gs.
  var KLUSTER_MENU = {
    A: ['M25', 'M26', 'M01', 'M04'],
    B: ['M02', 'M03'],
    C: ['M05', 'M06', 'M07', 'M11', 'M21'],
    D: ['M08', 'M09', 'M10', 'M12', 'M13', 'M24'],
    E: ['M14', 'M15', 'M16', 'M17', 'M18', 'M19', 'M20'],
    F: ['TDM', 'TDP', 'M22', 'M23']
  };

  function shell(content) {
    var priv = state.user;
    var menuItems = priv && state.menu ? privSidebar() : PUB_MENU;
    var ap = document.getElementById('app');
    ap.innerHTML = '<div class="app-shell">' +
      '<aside class="sidebar' + (state.sideCollapsed ? ' collapsed' : '') + '" id="sidebar"><div class="side-head"><div class="brand-logo">IN</div><div class="side-title">INDAKRIS</div></div>' +
      '<div class="side-scroll"><div class="side-group">' + (priv ? 'Menu Privat' : 'Menu Publik') + '</div>' +
      menuItems.map(function (m) { if (m.group) return '<div class="side-group">' + esc(m.group) + '</div>'; return '<div class="side-item' + (m.tone ? ' t-' + m.tone : '') + '" data-href="' + m.href + '" data-testid="' + (m.testid || 'nav-' + m.kode) + '"><i class="fa ' + m.icon + '"></i><span>' + esc(m.nama) + '</span>' + (m.badge ? '<span class="side-badge" data-testid="side-badge">' + m.badge + '</span>' : '') + '</div>'; }).join('') +
      '</div></aside>' +
      '<div class="side-backdrop" id="side-backdrop" data-testid="sidebar-backdrop"></div>' +
      '<div class="main' + (state.sideCollapsed ? ' full' : '') + '" id="main"><header class="header">' +
      '<button class="icon-btn" id="hamburger" aria-label="Menu" data-testid="hamburger-button"><i class="fa fa-bars"></i></button>' +
      '<div class="brand" data-href="#/"><div class="brand-logo">IN</div><div><div class="brand-name">INDAKRIS</div><div class="brand-sub">Informasi Data Krisis Kesehatan NTT</div></div></div>' +
      '<div class="hdr-search"><i class="fa fa-magnifying-glass"></i><input id="global-search" placeholder="Cari kejadian, kabupaten/kota, atau laporan..." data-testid="global-search"></div>' +
      '<div class="hdr-right"><span class="hdr-date"><i class="fa fa-calendar"></i><span id="hdr-now">' + nowStr() + '</span></span>' +
      (priv ? '<button class="icon-btn" id="btn-notif" aria-label="Notifikasi"><i class="fa fa-bell"></i>' + (state.pending && state.pending.total ? '<span class="dot">' + state.pending.total + '</span>' : '') + '</button>' +
        '<div class="user-chip" id="user-chip" data-testid="user-chip"><div class="avatar">' + esc(initial(priv.nama)) + '</div><div class="user-meta"><div class="user-name">' + esc(priv.nama) + '</div><div style="font-size:10.5px;color:var(--ink-soft)">' + esc(priv.roleLabel) + '</div></div><i class="fa fa-chevron-down" style="font-size:10px;color:var(--ink-soft)"></i></div>'
        : '<button class="btn btn-primary" id="btn-login" data-testid="login-button"><i class="fa fa-right-to-bracket"></i> Login</button>') +
      '</div></header><div class="content" id="page"></div></div></div>';

    $('#hamburger').onclick = function () {
      if (window.innerWidth <= 860) { $('#sidebar').classList.toggle('open'); return; }
      state.sideCollapsed = $('#sidebar').classList.toggle('collapsed');
      $('#main').classList.toggle('full', state.sideCollapsed);
    };
    $('#side-backdrop').onclick = function () { $('#sidebar').classList.remove('open'); };
    Array.prototype.forEach.call(document.querySelectorAll('.side-item'), function (n) { n.addEventListener('click', function () { $('#sidebar').classList.remove('open'); }); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-href]'), function (n) { n.onclick = function () { var h = n.getAttribute('data-href'); if (/^https?:/.test(h)) { window.open(h, '_top'); return; } location.hash = h; }; });
    if ($('#btn-login')) $('#btn-login').onclick = function () { location.hash = '#/login'; };
    if ($('#user-chip')) $('#user-chip').onclick = userMenu;
    if ($('#btn-notif')) $('#btn-notif').onclick = function () { toast(state.pending && state.pending.total ? state.pending.total + ' pendaftar menunggu aktivasi di Manajemen User.' : 'Tidak ada notifikasi baru.'); };
    var gs = $('#global-search');
    if (gs) gs.addEventListener('keydown', function (e) { if (e.key === 'Enter' && gs.value.trim()) globalSearch(gs.value.trim()); });
    if (!state.clockTimer) state.clockTimer = setInterval(function () { var n = $('#hdr-now'); if (n) n.textContent = nowStr(); }, 60000);
    var page = $('#page');
    page.appendChild(content);
  }
  // Logo kabupaten/kota: pakai gambar dari URL_Logo_Drive; jika kosong/gagal dimuat, kembali ke inisial
  function kabLogo(k) {
    var ini = initial(k.nama);
    if (!k.logo) return '<div class="kab-logo">' + esc(ini) + '</div>';
    return '<div class="kab-logo has-img"><img src="' + esc(k.logo) + '" alt="" loading="lazy" referrerpolicy="no-referrer" data-ini="' + esc(ini) + '" ' +
      'onerror="var p=this.parentNode;p.classList.remove(\'has-img\');p.textContent=this.getAttribute(\'data-ini\');"></div>';
  }
  function initial(nama) { return String(nama || '?').split(/\s+/).map(function (w) { return w.charAt(0); }).slice(0, 2).join('').toUpperCase(); }
  function privSidebar() {
    var items = [{ href: '#/app', icon: 'fa-chart-line', tone: 'P', nama: 'Data dan Grafik', testid: 'nav-app' }];
    if (state.user.role === 'SUPER_ADMIN') items.push({ href: '#/app/verifikasi-rha', icon: 'fa-clipboard-check', tone: 'F', nama: 'Verifikasi RHA', testid: 'nav-verifikasi-rha', badge: state.pendRHA || '' });
    var byKode = {};
    state.menu.forEach(function (m) { if (!m.custom) byKode[m.kode] = m; });
    ['A', 'B', 'C', 'D', 'E', 'F'].forEach(function (k) {
      var sub = [];
      KLUSTER_MENU[k].forEach(function (kode) {
        if (kode === 'TDM') sub.push({ href: '#/app/emt', icon: 'fa-truck-medical', tone: k, nama: 'Laporan TDM', testid: 'nav-emt' });
        else if (kode === 'TDP') sub.push({ href: '#/app/tdp', icon: 'fa-hand-holding-heart', tone: k, nama: 'Laporan TDP', testid: 'nav-tdp' });

  function userMenu(ev) {
    if (ev && ev.stopPropagation) ev.stopPropagation();

    if (!chip || !state.user) return;
    // klik chip lagi saat dropdown terbuka -> tutup
    var old = document.getElementById('user-drop');
    if (old) { if (old._tutup) old._tutup(); else old.remove(); return; }

    var dd = document.createElement('div');
    dd.id = 'user-drop';
    dd.className = 'user-drop';
    dd.setAttribute('role', 'menu');
    dd.innerHTML =
      '<div class="ud-head"><small>Sedang login sebagai</small><b>' + esc(state.user.nama) + '</b><span>' + esc(state.user.roleLabel) + '</span></div>' +

      '<div class="mi danger" role="menuitem" tabindex="0" data-a="out" data-testid="menu-logout"><i class="fa fa-right-from-bracket"></i> Logout</div>';
    document.body.appendChild(dd);

    var r = chip.getBoundingClientRect();
    dd.style.top = (r.bottom + 8) + 'px';
    dd.style.right = Math.max(12, window.innerWidth - r.right) + 'px';

    function tutup() {
      dd.remove();
      document.removeEventListener('click', luar, true);
      document.removeEventListener('keydown', tombol, true);
      window.removeEventListener('resize', tutup);
      window.removeEventListener('hashchange', tutup);
    }
    function luar(e) { if (!dd.contains(e.target) && !chip.contains(e.target)) tutup(); }
    function tombol(e) { if (e.key === 'Escape') tutup(); }
    dd._tutup = tutup;
    document.addEventListener('click', luar, true);
    document.addEventListener('keydown', tombol, true);
    window.addEventListener('resize', tutup);
    window.addEventListener('hashchange', tutup);

    function aksiEnter(node, fn) {
      node.onclick = fn;
      node.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } };
    }
    aksiEnter($('[data-a=pw]', dd), function () { tutup(); modalGantiPassword(); });
    aksiEnter($('[data-a=out]', dd), function () {
      tutup();
      api('logoutUser', getToken()).finally(function () { setToken(null); setUser(null); toast('Anda telah keluar.', 'ok'); state.menu = null; go('#/'); });
    });

      }).join(' · ');

    // ---------- Detail faskes ----------
    function opsiFaskes(b, jenis) {
      var daftar = REF.faskes.filter(function (f) { return f[3] === jenis && f[2] === b.id; });
      var semua = false;
      if (!daftar.length) { daftar = REF.faskes.filter(function (f) { return f[3] === jenis; }); semua = true; }
      daftar.sort(function (x, y) { return String(x[1]).localeCompare(String(y[1])); });
      return { daftar: daftar, semua: semua };
    }
    function renderFaskes(b) {
      var c = $('#r-' + b.key + '-df', md.el); if (!c) return;
      c.innerHTML = '<div class="section-label">Detail Fasilitas Kesehatan — ' + esc(b.nama) + '</div>' +
        '<div class="hint">Pilih nama faskes yang rusak. Bila belum ada di daftar, pilih "Lainnya" lalu ketik namanya.</div>' +

          '<select data-f="jenis">' + JENIS_FASKES.map(function (j) { return '<option value="' + j[0] + '"' + (f.jenis === j[0] ? ' selected' : '') + '>' + j[1] + '</option>'; }).join('') + '</select>' +
          '<select data-f="tingkat">' + TINGKAT.map(function (t) { return '<option' + (f.tingkat === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select>' +
          '<select data-f="idFaskes"><option value="">— Pilih faskes —</option>' + o.daftar.map(function (x) { return '<option value="' + esc(x[0]) + '"' + (f.idFaskes === x[0] ? ' selected' : '') + '>' + esc(x[1]) + (o.semua ? '' : '') + '</option>'; }).join('') + '<option value="LAIN"' + (f.idFaskes === 'LAIN' ? ' selected' : '') + '>Lainnya (belum ada di daftar)</option></select>' +
          '<input data-f="nama" placeholder="Nama faskes (Lainnya)" maxlength="200" value="' + esc(f.nama) + '" style="' + (f.idFaskes === 'LAIN' ? '' : 'display:none') + '">' +
          '<button type="button" class="icon-btn rha-del" data-del title="Hapus baris"><i class="fa fa-xmark"></i></button></div>' +
          (o.semua && f.idFaskes === '' ? '<div class="hint rha-sub">Belum ada ' + esc(f.jenis) + ' terdaftar untuk ' + esc(b.nama) + '; daftar menampilkan seluruh NTT.</div>' : '');
      }).join('');
      Array.prototype.forEach.call(c.querySelectorAll('.rha-row'), function (row) {
        var i = Number(row.getAttribute('data-i')), f = b.faskes[i];
        $('[data-del]', row).onclick = function () { b.faskes.splice(i, 1); renderBarisFaskes(b); infoFaskes(b); };
        Array.prototype.forEach.call(row.querySelectorAll('[data-f]'), function (x) {
          var up = function () {
            var nm = x.getAttribute('data-f'); f[nm] = x.value;
            if (nm === 'jenis') { f.idFaskes = ''; f.nama = ''; renderBarisFaskes(b); }
            if (nm === 'idFaskes') { if (f.idFaskes !== 'LAIN') f.nama = ''; renderBarisFaskes(b); }
            if (nm === 'jenis' || nm === 'tingkat') infoFaskes(b);
          };
          x.addEventListener('change', up); if (x.tagName === 'INPUT') x.addEventListener('input', up);
        });
      });
    }
    function infoFaskes(b) {
      var c = $('#r-' + b.key + '-fc', md.el); if (!c) return;
      var a = angkaBlok(b), out = [];
      JENIS_FASKES.forEach(function (j) {
        TINGKAT.forEach(function (t) {
          var kol = j[0] + '_' + t.replace(' ', '_'), t0 = a[kol] || 0;
          var n = b.faskes.filter(function (f) { return f.jenis === j[0] && f.tingkat === t; }).length;
          if (t0 || n) out.push('<span class="' + (n > t0 ? 'rha-over' : '') + '">' + j[1] + ' ' + t + ': ' + n + ' dari ' + t0 + '</span>');
        });
      });
      c.innerHTML = out.join(' · ') || '<span>Isi jumlah faskes rusak di atas terlebih dahulu.</span>';
    }

    // ---------- Blok per kabupaten ----------
    function buatBlok(kab) {
      var key = kab.id.replace(/[^A-Za-z0-9]/g, '_');
      var b = { id: kab.id, key: key, nama: kab.nama, korban: [], faskes: [], tanpaDetail: false };
      b.el2 = el('<div class="rha-blok" data-kab="' + esc(kab.id) + '"><div class="rha-blok-h"><i class="fa fa-location-dot"></i> ' + esc(kab.nama) + '</div><div class="form-grid">' +
        ANGKA.map(function (a) { return fldHTML('r-' + key + '-' + a[0], a[1], 'number', true); }).join('') +
        '</div><div class="hint">Isi 0 bila tidak ada. Penduduk Terdampak (jiwa) tidak boleh lebih kecil dari Meninggal + LB/RI + LR/RJ + Hilang.</div><div id="r-' + key + '-dk"></div></div>');
      b.el3 = el('<div class="rha-blok"><div class="rha-blok-h"><i class="fa fa-location-dot"></i> ' + esc(kab.nama) + '</div><div class="form-grid">' +
        FASK.map(function (a) { return fldHTML('r-' + key + '-' + a[0], a[1], 'number', true); }).join('') + '</div><div id="r-' + key + '-df"></div></div>');
      b.elKec = el('<div class="field"><label>Kecamatan terdampak — ' + esc(kab.nama) + ' (pisah dengan ;)</label><input id="r-' + key + '-kec" data-testid="r-' + key + '-kec"></div>');

    function segarkan() {
      var adaOtomatis = false;
      urutan.forEach(function (id) { if (nilaiBesar(blok[id]).length) adaOtomatis = true; });
      if (adaOtomatis) setBesar(true);
      var alasan = [];
      urutan.forEach(function (id) { var al = nilaiBesar(blok[id]); if (al.length) alasan.push(blok[id].nama + ': ' + al.join(', ')); });
      if (lintas()) alasan.push('kejadian mencakup lebih dari 1 kabupaten/kota');
      var besar = besarCentang() || alasan.length > 0;
      var teks = !urutan.length ? '' : (besar ? '<i class="fa fa-triangle-exclamation"></i> Kejadian besar dan masif' + (alasan.length ? ' \u2014 ' + esc(alasan.join('; ')) : '') + '. Setelah disetujui verifikator, data korban dan faskes diteruskan ke Menu Korban dan Menu Faskes (Kondisi).' : '<i class="fa fa-circle-info"></i> Kejadian berskala kecil: detail korban dan faskes tetap dapat diisi dan tersimpan di Menu RHA; data tidak diteruskan ke Menu Privat kecuali verifikator memutuskan lain.');
      Array.prototype.forEach.call(md.el.querySelectorAll('[data-besar-info]'), function (x) { x.innerHTML = teks; });
      urutan.forEach(function (id) { infoKorban(blok[id]); infoFaskes(blok[id]); });

    function gambarChips() {
      $('#r-kab-chips', md.el).innerHTML = urutan.map(function (id) { return '<span class="rha-chip">' + esc(blok[id].nama) + '<button type="button" data-rm="' + esc(id) + '" title="Hapus"><i class="fa fa-xmark"></i></button></span>'; }).join('');
      Array.prototype.forEach.call(md.el.querySelectorAll('[data-rm]'), function (x) { x.onclick = function () { hapusKab(x.getAttribute('data-rm')); }; });
      var kosong = '<div class="hint">Pilih kabupaten/kota terdampak pada bagian 1 terlebih dahulu.</div>';
      if (!urutan.length) { $('#rha-s2', md.el).innerHTML = kosong; $('#rha-s3', md.el).innerHTML = kosong; }
    }
    function tambahKab(id) {
      var kab = REF.kabupaten.filter(function (k) { return k.id === id; })[0];
      if (!kab) return;
      if (blok[id]) { toast('Kabupaten/kota ini sudah ditambahkan.', 'fail'); return; }
      var b = buatBlok(kab); blok[id] = b; urutan.push(id);
      if (urutan.length === 1) { $('#rha-s2', md.el).innerHTML = ''; $('#rha-s3', md.el).innerHTML = ''; }
      $('#rha-s2', md.el).appendChild(b.el2); $('#rha-s3', md.el).appendChild(b.el3); $('#r-kab-kec', md.el).appendChild(b.elKec);
      renderKorban(b); renderFaskes(b); gambarChips(); segarkan();
    }
    function hapusKab(id) {
      var b = blok[id]; if (!b) return;
      [b.el2, b.el3, b.elKec].forEach(function (x) { if (x && x.parentNode) x.parentNode.removeChild(x); });
      delete blok[id]; urutan = urutan.filter(function (x) { return x !== id; });
      gambarChips(); segarkan();
    }
    $('#r-kab-add', md.el).onclick = function () { var s = $('#r-kab', md.el); if (!s.value) { toast('Pilih kabupaten/kota terlebih dahulu.', 'fail'); return; } tambahKab(s.value); s.value = ''; };
    md.el.addEventListener('input', function (e) { var t = e.target; if (t && t.type === 'number' && /^r-/.test(t.id || '') && t.id.indexOf('-') > 1) segarkan(); });
    Array.prototype.forEach.call(md.el.querySelectorAll('[data-besar]'), function (x) { x.addEventListener('change', function () { setBesar(x.checked); segarkan(); }); });
    gambarKriteria();

    function muatRef(coba) {
      api('getReferensiFormRHA').then(function (r) {
        var sel = $('#r-kab', md.el);
        if (!r.success || !r.data.kabupaten.length) {
          if (coba < 3) { setTimeout(function () { muatRef(coba + 1); }, 1200 * coba); return; }
          toast('Daftar kabupaten gagal dimuat. Tutup lalu buka formulir lagi.', 'fail'); return;
        }
        REF = { kabupaten: r.data.kabupaten, faskes: r.data.faskes || [], opsiUsia: r.data.opsiUsia || REF.opsiUsia, ambang: r.data.ambang || REF.ambang };
        REF.kabupaten.forEach(function (k) { sel.appendChild(el('<option value="' + esc(k.id) + '">' + esc(k.nama) + '</option>')); });
        urutan.forEach(function (id) { renderFaskes(blok[id]); });
        gambarKriteria(); segarkan();
      });
    }
    muatRef(1);
    $('#r-tgl', md.el).value = today();
    $('#r-tahun', md.el).value = today().substring(0, 4);
    $('#r-tgl', md.el).addEventListener('change', function () { $('#r-tahun', md.el).value = ($('#r-tgl', md.el).value || '').substring(0, 4); });

    // ---------- Kirim ----------
    var b = el('<button class="btn btn-primary" data-testid="submit-rha"><i class="fa fa-paper-plane"></i> Kirim Laporan</button>');
    b.onclick = function () {
      function gagal(m) { toast(m, 'fail'); }
      if (!val('r-tgl') || !urutan.length || !val('r-jenis') || !val('r-kron') || !val('r-nama') || !val('r-kontak')) { gagal('Lengkapi kolom wajib pada Identitas Kejadian (termasuk minimal 1 kabupaten/kota, Nama dan Kontak Pelapor).'); return; }
      var kabupaten = [];
      for (var q = 0; q < urutan.length; q++) {
        var bk = blok[urutan[q]], pre = bk.nama + ': ';
        var semua = ANGKA.concat(FASK);
        for (var i = 0; i < semua.length; i++) { if (val('r-' + bk.key + '-' + semua[i][0]) === '') { gagal(pre + 'seluruh kolom angka wajib diisi (isi 0 bila tidak ada).'); return; } }
        var a = angkaBlok(bk);
        if (a.Penduduk_Terdampak_Jiwa < a.Meninggal + a.LB_RI + a.LR_RJ + a.Hilang) { gagal(pre + 'Penduduk Terdampak (jiwa) tidak boleh lebih kecil dari Meninggal + LB/RI + LR/RJ + Hilang.'); return; }
        var korban = [], faskes = [];
        if (!bk.tanpaDetail) {
          for (var j = 0; j < bk.korban.length; j++) {
            var k = bk.korban[j], no = pre + 'detail korban baris ' + (j + 1) + ': ';
            if (!k.nama.trim()) { gagal(no + 'nama wajib diisi.'); return; }
            if (k.usia === '' || Number(k.usia) < 0 || Number(k.usia) > 120) { gagal(no + 'usia harus 0 sampai 120 tahun.'); return; }
            if (Number(k.usia) <= 1 && (k.usiaBulan === '' || Number(k.usiaBulan) < 0 || Number(k.usiaBulan) > 11)) { gagal(no + 'usia (bulan) wajib diisi 0 sampai 11.'); return; }
            if (!k.jk) { gagal(no + 'jenis kelamin wajib dipilih.'); return; }
            korban.push({ status: k.status, nama: k.nama.trim(), usia: Number(k.usia), usiaBulan: Number(k.usia) <= 1 ? Number(k.usiaBulan) : '', jk: k.jk, alamat: k.alamat.trim() });
          }
          for (var s = 0; s < STATUS_KORBAN.length; s++) {
            var n = korban.filter(function (x) { return x.status === STATUS_KORBAN[s][0]; }).length;
            if (n > (a[STATUS_KORBAN[s][2]] || 0)) { gagal(pre + 'detail korban ' + STATUS_KORBAN[s][0] + ' (' + n + ') melebihi jumlah pada ringkasan (' + (a[STATUS_KORBAN[s][2]] || 0) + ').'); return; }
          }
        }
        var dipakai = {};
        for (var f = 0; f < bk.faskes.length; f++) {
          var x = bk.faskes[f], nf = pre + 'detail faskes baris ' + (f + 1) + ': ';
          if (!x.idFaskes) { gagal(nf + 'pilih faskes atau "Lainnya".'); return; }
          if (x.idFaskes === 'LAIN' && !x.nama.trim()) { gagal(nf + 'nama faskes (Lainnya) wajib diisi.'); return; }
          if (x.idFaskes !== 'LAIN') { if (dipakai[x.idFaskes]) { gagal(nf + 'faskes yang sama dipilih lebih dari sekali.'); return; } dipakai[x.idFaskes] = 1; }
          faskes.push({ jenis: x.jenis, tingkat: x.tingkat, idFaskes: x.idFaskes === 'LAIN' ? '' : x.idFaskes, nama: x.idFaskes === 'LAIN' ? x.nama.trim() : '' });
        }
        for (var jf = 0; jf < JENIS_FASKES.length; jf++) for (var tf = 0; tf < TINGKAT.length; tf++) {
          var kol = JENIS_FASKES[jf][0] + '_' + TINGKAT[tf].replace(' ', '_');
          var nn = faskes.filter(function (y) { return y.jenis === JENIS_FASKES[jf][0] && y.tingkat === TINGKAT[tf]; }).length;
          if (nn > (a[kol] || 0)) { gagal(pre + 'detail faskes ' + JENIS_FASKES[jf][1] + ' ' + TINGKAT[tf] + ' (' + nn + ') melebihi jumlah pada ringkasan (' + (a[kol] || 0) + ').'); return; }
        }
        kabupaten.push({ idKabupaten: bk.id, kecamatan: val('r-' + bk.key + '-kec'), angka: a, korban: korban, faskes: faskes });
      }
      var payload = {
        deviceToken: deviceToken(), honeypot: val('r-honeypot'),
        tglKejadian: val('r-tgl'), waktuKejadian: val('r-waktu'), jenisBencana: val('r-jenis'), kronologi: val('r-kron'),
        namaPelapor: val('r-nama'), kontakPelapor: val('r-kontak'), urlFoto: val('r-foto'), urlBerita: val('r-berita'),
        Ketersediaan_Sumber_Daya: val('r-sd'), Upaya_Penanggulangan: val('r-upaya'), Bantuan_Diperlukan_Segera: val('r-bantuan'), Rekomendasi: val('r-reko'),
        besarManual: besarCentang(), kabupaten: kabupaten
      };
      b.disabled = true; b.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Mengirim...';
      api('submitLaporanRHA', payload).then(function (r) {
        if (!r.success) { b.disabled = false; b.innerHTML = '<i class="fa fa-paper-plane"></i> Kirim Ulang'; toast(r.message, 'fail'); return; }
        md.close(); toast(r.message, 'ok');
        var s = modal({ title: 'Laporan Terkirim', narrow: true, locked: true });
        var daftar = (r.data.laporan || []).length > 1 ? '<div class="hint" style="margin-top:10px;text-align:left">ID per kabupaten/kota:<br>' + r.data.laporan.map(function (x) { return esc(x.kabupaten) + ': <b>' + esc(x.id) + '</b>'; }).join('<br>') + '</div>' : '';
        s.body.innerHTML = '<div style="text-align:center;padding:8px 0"><div style="font-size:44px;color:var(--green)"><i class="fa fa-circle-check"></i></div>' +
          '<p style="color:var(--ink-soft)">Laporan diterima dan menunggu verifikasi Super Admin.<br>Simpan ID laporan Anda:</p>' +
          '<div style="display:flex;align-items:center;justify-content:center;gap:10px"><b style="font-size:20px;color:var(--primary-deep)" data-testid="report-id">' + esc(r.data.idKejadian) + '</b></div>' + daftar + '</div>';
        var cp = copyBtn(); cp.onclick = function () { copyText(r.data.idKejadian); };
        $('[data-testid=report-id]', s.el).parentNode.appendChild(cp);
        var ok = el('<button class="btn btn-primary">Selesai</button>');
        ok.onclick = function () { s.close(); location.hash = '#/laporan-rha'; };
        s.foot.appendChild(ok);
      });
    };
    md.foot.appendChild(b);
  }

  // ============ Halaman: Tim TDM / TDP (Berkas C & D) ============

    // ---- Tiga tab laporan (Kedatangan, Harian, Kepulangan), masing-masing dengan tombol unduh PDF ----
    var TABS_TIM = [['kedatangan', 'Laporan Kedatangan', 'fa-plane-arrival'], ['harian', 'Laporan Harian', 'fa-calendar-day'], ['kepulangan', 'Laporan Kepulangan', 'fa-plane-departure']];

    function unduhTimPdf(jenis, id, btn) {

        toast('PDF diunduh.', 'ok');

      [].forEach.call(isi.querySelectorAll('button[data-unduh]'), function (x) {

    function gambarTabTim() {
      var tb = $('#tim-tabs', div); tb.innerHTML = '';
      TABS_TIM.forEach(function (t) {
        var x = el('<button class="btn btn-sm ' + (t[0] === tabTim ? 'btn-primary' : 'btn-ghost') + '" data-testid="tim-tab-' + t[0] + '"><i class="fa ' + t[2] + '"></i> ' + t[1] + '</button>');

  function emtUnduhPdf(nama, b64) {
    var bin = atob(b64), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([u], { type: 'application/pdf' }));
    a.download = nama; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

      if (!hd || !bd) return;
      var blocks = [], kv = null;
      [].forEach.call(bd.querySelectorAll('.field, table.emt-tbl'), function (n) {
        if (n.tagName === 'TABLE') {
          kv = null;
          blocks.push({ header: true, rows: [].map.call(n.rows, function (tr) { return [].map.call(tr.cells, emtTeksSel); }) });
        } else {
          if (!kv) { kv = { header: false, rows: [] }; blocks.push(kv); }
          var lb = n.querySelector('label'), pre = n.parentNode.previousElementSibling;
          var jdl = (pre && pre.classList.contains('section-label') ? pre.textContent.trim() + ' \u2014 ' : '') + (lb ? lb.textContent.replace(/\s*\*\s*$/, '').trim() : '');
          kv.rows.push([jdl, emtTeksSel(n)]);

      // Bagian tanpa huruf (bullet, mis. "Catatan khusus") hanya memakai teks judul.
      var nEl = hd.querySelector('.n'), huruf = nEl ? nEl.textContent.trim() : '';
      var judulBagian = hd.textContent.replace(/\s+/g, ' ').trim();
      if (nEl && judulBagian.indexOf(huruf) === 0) judulBagian = judulBagian.slice(huruf.length).trim();
      if (/^[A-Z]$/.test(huruf)) judulBagian = huruf + '. ' + judulBagian;

  // ============ SDM Kesehatan (M04): baris JUMLAH di bawah tabel ============
  function sdmTfoot(cfg, d) {
    var idx = -1; cfg.cols.forEach(function (c, i) { if (c.k === 'Jumlah') idx = i; });
    if (idx < 0) return '';
    var sisa = cfg.cols.length - idx;   // kolom setelah Jumlah (Status) + Aksi
    var hal = d.rows.reduce(function (a, r) { return a + (Number(r.Jumlah) || 0); }, 0);
    function baris(label, id, nilai) { return '<tr class="sdm-total" id="' + id + '"><td colspan="' + (idx + 1) + '" style="text-align:right"><b>' + label + '</b></td><td class="num"><b>' + nilai + '</b></td><td colspan="' + sisa + '"></td></tr>'; }
    var banyak = d.total > d.rows.length;
    return '<tfoot>' + (banyak ? baris('Jumlah halaman ini', 'sdm-tot-hal', disp(hal)) + baris('Jumlah seluruh data (sesuai filter)', 'sdm-tot-all', '<i class="fa fa-spinner fa-spin"></i>') : baris('JUMLAH', 'sdm-tot-all', disp(hal))) + '</tfoot>';
  }
  // Total seluruh halaman sesuai filter yang sedang aktif (pageSize 100 per permintaan)
  function sdmTotalSemua(p, cb) {
    var tot = 0, page = 1;
    (function ambil() {
      api('getMenuData', getToken(), 'M04', { search: p.search, dari: p.dari, sampai: p.sampai, idKabupaten: p.idKabupaten, status: p.status, page: page, pageSize: 100 }).then(function (r) {
        if (!r || !r.success) { cb(null); return; }
        r.data.rows.forEach(function (x) { tot += Number(x.Jumlah) || 0; });
        if (!r.data.rows.length || page * 100 >= r.data.total || page >= 100) { cb(tot); return; }
        page++; ambil();
      });
    })();
  }

  // ============ Menu Korban (M25): tabel + formulir di HALAMAN BARU + edit langsung data hasil RHA ============
  // [PERUBAHAN KORBAN] Urutan kolom tabel = urutan isian pada formulir Tambah Data.
  var KORBAN_KOLOM = [['tgl', 'Tanggal Kejadian Awal'], ['kabupaten', 'Kabupaten'], ['nama', 'Nama'], ['jk', 'Jenis Kelamin'], ['usia', 'Usia'], ['kategori', 'Kategori Usia'],
    ['statusAwal', 'Status Awal'], ['diagnosa', 'Diagnosa/Keterangan'], ['alamat', 'Alamat'], ['kecamatan', 'Kecamatan'], ['lokasiKejadian', 'Lokasi Kejadian'],
    ['lokasiPerawatan', 'Lokasi Perawatan'], ['rujukan', 'Rujukan'], ['wn', 'Kewarganegaraan']];
  var KORBAN_TEKS_PANJANG = { alamat: 1, lokasiKejadian: 1, diagnosa: 1, lokasiPerawatan: 1, kecamatan: 1 };
  var KORBAN_RUJUKAN = ['Tidak Darurat', 'Darurat Stabil', 'Darurat Kritis'];
  // Kolom yang boleh dilengkapi pada data hasil RHA: [nama field server, panjang maks, jenis]. Kolom lain pada baris RHA TERKUNCI (hanya baca).
  var KORBAN_EDIT_RHA = { diagnosa: ['Diagnosa', 500, 'ta'], kecamatan: ['Kecamatan', 100, 'ta'], lokasiKejadian: ['Lokasi_Kejadian', 300, 'ta'],
    lokasiPerawatan: ['Lokasi_Perawatan', 200, 'ta'], rujukan: ['Rujukan', 0, 'sel'], wn: ['Kewarganegaraan', 0, 'sel'] };

  function korbanBadge(s) {
    if (!bolehValidasiUI()) return badge(s === 'Tervalidasi' || s === 'Terverifikasi' ? 'Terverifikasi' : 'Diajukan');   // status validasi hanya terlihat Admin Provinsi/Super Admin
    return s === 'Tervalidasi' ? badge('Tervalidasi') : s === 'Terverifikasi' ? badge('Terverifikasi') : '<span class="badge badge-draft">Belum Diverifikasi</span>';
  }

  // Penanda baris hasil integrasi RHA. SESUAIKAN BAGIAN INI bila Service_Korban.gs memakai nama field lain
  // (satu-satunya tempat yang menentukan baris mana yang dikunci).
  function korbanDariRha(row) {
    var s = String(row.sumber || row.sumberData || row.sumberModul || row.Sumber_Modul || '').toUpperCase();
    return s === 'RHA' || !!(row.idRha || row.idLaporanRha || row.ID_Laporan_RHA || row.ID_RHA);
  }

  function korbanOpsi(o) {
    o = o || {};
    return {
      jk: o.jk && o.jk.length ? o.jk : ['Laki-laki', 'Perempuan'],
      statusAwal: o.statusAwal && o.statusAwal.length ? o.statusAwal : ['Meninggal', 'Luka Berat', 'Luka Ringan', 'Hilang'],
      wn: o.wn && o.wn.length ? o.wn : ['WNI', 'WNA'],
      kategori: o.kategori || [], bayi: o.bayi || ['', '']
    };
  }

  // Kategori usia otomatis (aturan sama dengan server: opsi.bayi dan opsi.kategori dikirim oleh getKorban)
  function katUsiaKorban(opsi, u, b) {
    if (u === '' || isNaN(Number(u)) || Number(u) < 0) return '';
    u = Number(u);
    if (u <= 1) {
      if (b === '' || isNaN(Number(b)) || Number(b) < 0 || Number(b) > 11) return '';
      return (u * 12 + Number(b)) <= 5 ? opsi.bayi[0] : opsi.bayi[1];
    }
    for (var i = 0; i < opsi.kategori.length; i++) if (u <= opsi.kategori[i][0]) return opsi.kategori[i][1];
    return '';
  }

  // Textarea yang tinggi barisnya menyesuaikan isi
  function autoGrow(ta) { if (!ta) return; ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; }
  function pasangAutoGrow(root) {
    Array.prototype.forEach.call(root.querySelectorAll('textarea.kb-ta, textarea.kb-ie'), function (t) {
      t.addEventListener('input', function () { autoGrow(t); });
      autoGrow(t);
    });
  }
  function opsiKorbanHtml(list, val, ph) {
    if (val && list.indexOf(val) < 0) list = list.concat([val]);   // nilai lama (mis. "Dirujuk") tetap tampil agar tidak hilang saat disimpan
    return (ph ? '<option value="">' + esc(ph) + '</option>' : '') + list.map(function (o) { return '<option' + (o === val ? ' selected' : '') + ' value="' + esc(o) + '">' + esc(o) + '</option>'; }).join('');
  }

  // Tampilan usia: 0 th = "8 bln", 1 th = "1 th 8 bln", selebihnya "34 th"
  function fmtUsiaKorban(row) {
    if (row.usia === null || row.usia === undefined || row.usia === '') return '—';
    var b = row.usiaBulan;
    if (row.usia === 0) return (b === null || b === undefined || b === '') ? '0 th' : b + ' bln';
    if (row.usia === 1 && b !== null && b !== undefined && b !== '' && b > 0) return '1 th ' + b + ' bln';
    return row.usia + ' th';
  }

  // Pemeriksaan sisi-klien (server tetap memeriksa ulang). Mengembalikan {id, msg} atau null.
  // [PERUBAHAN KORBAN] Rujukan tidak wajib ("-- Pilih --" diperbolehkan); Tujuan Rujukan tidak lagi ada di formulir.
  function korbanCek(v, tinggi, lbl) {
    lbl = lbl || '';
    var wajib = [['tgl', 'Tanggal Kejadian Awal', v.Tgl_Kejadian_Awal], ['nama', 'Nama', v.Nama], ['jk', 'Jenis Kelamin', v.Jenis_Kelamin],
      ['usia', 'Usia', v.Usia], ['status', 'Status Awal', v.Status_Awal]];
    if (tinggi) wajib.push(['kab', 'Kabupaten', v.ID_Kabupaten]);
    wajib.push(['wn', 'Kewarganegaraan', v.Kewarganegaraan]);
    for (var i = 0; i < wajib.length; i++) if (!wajib[i][2]) return { id: wajib[i][0], msg: wajib[i][1] + ' wajib diisi' + lbl + '.' };
    if (v.Tgl_Kejadian_Awal > today()) return { id: 'tgl', msg: 'Tanggal Kejadian Awal tidak boleh melewati hari ini.' };
    if (v.Nama.length < 2) return { id: 'nama', msg: 'Nama terlalu pendek' + lbl + '.' };
    if (!/^\d{1,3}$/.test(v.Usia) || Number(v.Usia) > 120) return { id: 'usia', msg: 'Usia harus bilangan bulat 0 sampai 120' + lbl + '.' };
    if (Number(v.Usia) <= 1) {
      if (v.Usia_Bulan === '') return { id: 'bln', msg: 'Usia (bulan) wajib diisi untuk usia 0 atau 1 tahun' + lbl + '.' };
      if (!/^\d{1,2}$/.test(v.Usia_Bulan) || Number(v.Usia_Bulan) > 11) return { id: 'bln', msg: 'Usia (bulan) harus bilangan bulat 0 sampai 11' + lbl + '.' };
    }
    return null;
  }

  // Muatan lengkap untuk updateKorban dari baris tabel (server memeriksa ulang seluruh isian, jadi kolom terkunci ikut dikirim apa adanya)
  function korbanPayloadDariRow(row) {
    var s = function (x) { return x === null || x === undefined ? '' : String(x); };
    return { Tgl_Kejadian_Awal: s(row.tgl).substring(0, 10), Nama: s(row.nama), Jenis_Kelamin: s(row.jk), Usia: s(row.usia), Usia_Bulan: s(row.usiaBulan), Status_Awal: s(row.statusAwal),
      ID_Kabupaten: s(row.idKab), Kecamatan: s(row.kecamatan), Alamat_Korban: s(row.alamat), Lokasi_Kejadian: s(row.lokasiKejadian), Diagnosa: s(row.diagnosa),
      Kewarganegaraan: s(row.wn) || 'WNI', Lokasi_Perawatan: s(row.lokasiPerawatan), Rujukan: s(row.rujukan), Tujuan_Rujukan: s(row.tujuanRujukan) };
  }

  // Tab lain (formulir Tambah/Ubah) memberi tahu tabel agar memuat ulang setelah data tersimpan
  window.addEventListener('storage', function (e) {
    if (e && e.key === 'indakris_korban_ping' && typeof window.KORBAN_MUAT_ULANG === 'function') window.KORBAN_MUAT_ULANG();
  });

  function pageKorban() {
    var st = state.menuPage.M25 = state.menuPage.M25 || { search: '', dari: '', sampai: '', kab: '', status: '', page: 1, pageSize: 20 };
    var tinggi = state.user.role === 'SUPER_ADMIN' || state.user.role === 'ADMIN_PROVINSI';
    if (!tinggi) st.kab = '';
    var opsi = null, byId = {}, lastD = null, editId = null;
    var div = el('<div></div>');
    div.innerHTML = '<div class="page-head"><div><h2 class="page-title" data-testid="page-title">KORBAN</h2><div class="page-sub">Informasi Data Krisis Kesehatan NTT</div>' +
      '<div class="scope-line" style="margin-top:6px"><span class="dot"></span>Wilayah aktif <span class="js-wil-kb">' + esc(state.user.idKabupaten || 'Provinsi NTT') + '</span> &nbsp;&bull;&nbsp; <i class="fa fa-clock" style="margin-right:4px"></i>' + nowStr() + '</div></div>' +
      '<div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn btn-export btn-sm" id="kb-pdf"><i class="fa fa-file-pdf"></i> PDF</button>' +
      '<button class="btn btn-export btn-sm" id="kb-xls"><i class="fa fa-file-excel"></i> Excel</button>' +
      '<button class="btn btn-add" id="kb-add" data-testid="add-data-button"><i class="fa fa-plus"></i> Tambah Data</button></div></div>' +
      '<div class="card"><div class="card-pad"><div class="filter-row">' +
      '<div class="field" style="margin:0"><label>Pencarian</label><input id="kb-q" placeholder="Cari nama, alamat, diagnosa..." value="' + esc(st.search) + '" data-testid="menu-search"></div>' +
      '<div class="field" style="margin:0"><label>Dari Tanggal</label><input type="date" id="kb-dari" value="' + st.dari + '"></div>' +
      '<div class="field" style="margin:0"><label>Sampai Tanggal</label><input type="date" id="kb-sampai" value="' + st.sampai + '"></div>' +
      '<div class="field" style="margin:0"><label>Kabupaten / Kota</label>' + (tinggi ? '<select id="kb-kab"><option value="">Semua Wilayah</option></select>' : '<select id="kb-kab" disabled title="Data dibatasi pada wilayah akun Anda"><option value="">…</option></select>') + '</div>' +
      '<button class="btn btn-primary btn-sm" id="kb-apply" data-testid="apply-filter">Terapkan</button>' +
      '<button class="btn btn-ghost btn-sm" id="kb-reset" data-testid="reset-filter">Reset</button></div>' +
      '<div class="note-info"><i class="fa fa-circle-info"></i><span>Data baru berstatus <b>Belum Divalidasi</b>. Data <b>hasil integrasi Menu RHA</b> tampil otomatis dengan kolom dasar terkunci; klik <b>Edit</b> untuk melengkapi kolom yang masih kosong (Diagnosa, Kecamatan, Lokasi Kejadian, Lokasi Perawatan, Rujukan, Kewarganegaraan).</span></div>' +
      '<div id="kb-tabs" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"></div>' +
      '<div id="kb-body"><div class="empty"><i class="fa fa-spinner fa-spin"></i>Memuat data...</div></div>' +
      '<div class="pager" id="kb-pager"></div></div></div>';

    if (tinggi) {
      api('getKabupatenPublik').then(function (r) {
        var sel = $('#kb-kab', div);
        if (r.success) r.data.kabupaten.forEach(function (k) { sel.appendChild(el('<option value="' + esc(k.id) + '">' + esc(k.nama) + '</option>')); });
        sel.value = st.kab;
      });
    } else {
      namaKab(state.user.idKabupaten, function (n) { $('#kb-kab', div).innerHTML = '<option value="">' + esc(n) + '</option>'; });
    }
    namaKab(state.user.idKabupaten, function (n) { var x = $('.js-wil-kb', div); if (x) x.textContent = n; });

    // Sel tabel biasa (baca saja)
    function celBiasa(c, row, rha) {
      if (c[0] === 'usia') return '<td>' + esc(fmtUsiaKorban(row)) + '</td>';
      var v = row[c[0]], kosong = (v === '' || v === null || v === undefined);
      var gaya = KORBAN_TEKS_PANJANG[c[0]] ? ' style="min-width:170px;white-space:normal"' : '';
      var cls = kosong && rha && KORBAN_EDIT_RHA[c[0]] ? ' class="kb-kosong"' : '';
      var chip = c[0] === 'nama' && rha ? '<span class="kb-chip-rha" title="Data hasil integrasi Menu RHA">RHA</span>' : '';
      return '<td' + gaya + cls + '>' + esc(kosong ? '—' : v) + chip + '</td>';
    }
    // Sel tabel mode edit (hanya kolom yang boleh dilengkapi)
    function celEdit(c, row) {
      var d = KORBAN_EDIT_RHA[c[0]], v = row[c[0]] === null || row[c[0]] === undefined ? '' : String(row[c[0]]);
      if (d[2] === 'ta') return '<td style="min-width:200px;white-space:normal"><textarea class="kb-ie" rows="1" maxlength="' + d[1] + '" data-f="' + c[0] + '">' + esc(v) + '</textarea></td>';
      var isRuj = c[0] === 'rujukan';
      return '<td style="min-width:150px"><select class="kb-ie" data-f="' + c[0] + '">' + opsiKorbanHtml(isRuj ? KORBAN_RUJUKAN : korbanOpsi(opsi).wn, isRuj ? v : (v || 'WNI'), isRuj ? '-- Pilih --' : '') + '</select></td>';
    }

    function gambar(d) {
      var b = $('#kb-body', div);
      $('#kb-add', div).style.display = d.izin.tambah ? 'inline-flex' : 'none';
      var tabs = [['', 'Semua (' + d.counts.total + ')'], ['belum', 'Belum Divalidasi (' + d.counts.belum + ')'], ['valid', 'Tervalidasi (' + d.counts.valid + ')']].filter(function (t, i) { return i === 0 || bolehValidasiUI(); });
      $('#kb-tabs', div).innerHTML = tabs.map(function (t) { return '<span class="chip" data-st="' + t[0] + '" style="cursor:pointer;' + (st.status === t[0] ? 'background:var(--primary);color:#fff' : '') + '">' + esc(t[1]) + '</span>'; }).join('');
      Array.prototype.forEach.call($('#kb-tabs', div).querySelectorAll('[data-st]'), function (t) { t.onclick = function () { st.status = t.getAttribute('data-st'); st.page = 1; editId = null; load(); }; });
      if (!d.rows.length && d.total > 0 && st.page > 1) { st.page = Math.max(1, Math.ceil(d.total / st.pageSize)); load(); return; }
      if (!d.rows.length) { b.innerHTML = emptyState('Belum ada data korban pada lingkup Anda.'); $('#kb-pager', div).innerHTML = ''; return; }
      byId = {};
      d.rows.forEach(function (x) { byId[x.id] = x; });
      var head = '<th>No</th>' + KORBAN_KOLOM.map(function (c) { return '<th>' + esc(c[1]) + '</th>'; }).join('') + '<th>Status</th><th>Aksi</th>';
      var body = d.rows.map(function (row, i) {
        var rha = korbanDariRha(row), a = row.aksi || {}, editing = editId === row.id && rha && a.edit;
        var tds = KORBAN_KOLOM.map(function (c) { return (editing && KORBAN_EDIT_RHA[c[0]]) ? celEdit(c, row) : celBiasa(c, row, rha); }).join('');
        var aksi = editing
          ? '<button class="btn btn-primary btn-sm" data-act="simpan" data-testid="korban-inline-save"><i class="fa fa-save"></i> Simpan</button><button class="btn btn-ghost btn-sm" data-act="batal">Batal</button>'
          : (a.edit ? '<button class="btn btn-ghost btn-sm" data-act="edit" data-testid="korban-edit"><i class="fa fa-pen"></i> Edit</button>' : '') +
            (a.verifikasi && bolehVerifikasiUI() ? '<button class="btn btn-primary btn-sm" data-act="verifikasi" data-testid="korban-verifikasi"><i class="fa fa-clipboard-check"></i> Verifikasi</button>' : '') +
            (a.validasi && bolehValidasiUI() ? '<button class="btn btn-primary btn-sm" data-act="validasi" data-testid="korban-validasi"><i class="fa fa-circle-check"></i> Validasi</button>' : '') +
            (a.hapus ? '<button class="btn btn-ghost btn-sm" data-act="hapus" data-testid="korban-hapus" style="color:#c0392b"><i class="fa fa-trash"></i> Hapus</button>' : '');
        return '<tr data-testid="menu-row" class="rowlink' + (editing ? ' kb-editing' : '') + '" data-id="' + esc(row.id) + '"><td>' + ((d.page - 1) * d.pageSize + i + 1) + '</td>' + tds +
          '<td>' + korbanBadge(row.status) + '</td><td><div style="display:flex;gap:6px;flex-wrap:nowrap">' + aksi + '</div></td></tr>';
      }).join('');
      b.innerHTML = '<div class="table-wrap"><table class="grid" style="min-width:2300px"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>';
      pasangAutoGrow(b);

      var pr = $('#kb-pager', div), pages = Math.max(1, Math.ceil(d.total / d.pageSize));
      pr.innerHTML = '<span class="pager-info">Menampilkan ' + ((d.page - 1) * d.pageSize + 1) + '–' + Math.min(d.page * d.pageSize, d.total) + ' dari ' + fmt(d.total) + ' data</span>' +
        '<button class="pg" ' + (d.page <= 1 ? 'disabled' : '') + ' data-p="prev"><i class="fa fa-chevron-left"></i></button>' +
        Array.from({ length: Math.min(pages, 7) }, function (_, i) { var n = Math.max(1, Math.min(d.page - 3, pages - 6)) + i; return '<button class="pg ' + (n === d.page ? 'active' : '') + '" data-p="' + n + '">' + n + '</button>'; }).join('') +
        '<button class="pg" ' + (d.page >= pages ? 'disabled' : '') + ' data-p="next"><i class="fa fa-chevron-right"></i></button>' +
        '<select class="mini-select" id="kb-ps"><option>20</option><option>50</option><option>100</option></select><span style="color:var(--ink-soft);font-size:12px">data per halaman</span>';
      $('#kb-ps', div).value = String(st.pageSize);
      $('#kb-ps', div).onchange = function () { st.pageSize = Number($('#kb-ps', div).value); st.page = 1; editId = null; load(); };
      Array.prototype.forEach.call(pr.querySelectorAll('[data-p]'), function (btn) { btn.onclick = function () { var v = btn.getAttribute('data-p'); st.page = v === 'prev' ? d.page - 1 : v === 'next' ? d.page + 1 : Number(v); editId = null; load(); }; });

      Array.prototype.forEach.call(b.querySelectorAll('tr[data-id]'), function (tr) {
        tr.onclick = function (e) {
          var row = byId[tr.getAttribute('data-id')];
          if (!row) return;
          var act = e.target.closest('[data-act]');
          if (!act) {
            if (tr.classList.contains('kb-editing') || e.target.closest('textarea,select,input')) return;
            detailKorban(row); return;
          }
          var a = act.getAttribute('data-act');
          if (a === 'edit') {
            if (korbanDariRha(row)) { editId = row.id; gambar(lastD); var f0 = $('tr.kb-editing .kb-ie', b); if (f0) f0.focus(); }   // data RHA: lengkapi langsung di tabel
            else bukaFormKorban(row, opsi, load);                                                                                    // data manual: formulir di halaman baru
          } else if (a === 'batal') { editId = null; gambar(lastD); }
          else if (a === 'simpan') simpanInline(row, tr, act);
          else if (a === 'verifikasi') confirmDlg('Verifikasi Data Korban', 'Verifikasi data korban <b>' + esc(row.nama) + '</b> (' + esc(row.id) + ')?<br>Setelah diverifikasi, data dapat divalidasi oleh Admin Provinsi atau Super Admin.', function () {
            api('verifikasiKorban', getToken(), row.id).then(function (res) { toast(res.message, res.success ? 'ok' : 'fail'); if (res.success) load(); });
          }, 'Ya, Verifikasi');
          else if (a === 'validasi') validasiKorbanUI(row, opsi, load);
          else if (a === 'hapus') confirmDlg('Hapus Data Korban', 'Data korban <b>' + esc(row.nama) + '</b> (' + esc(row.id) + ') akan dihapus (soft delete) dan tercatat di log audit. Lanjutkan?', function () {
            api('hapusKorban', getToken(), row.id).then(function (res) { toast(res.message, res.success ? 'ok' : 'fail'); if (res.success) load(); });
          }, 'Hapus');
        };
      });
    }

    function simpanInline(row, tr, btn) {
      var g = function (f) { var n = tr.querySelector('[data-f="' + f + '"]'); return n ? String(n.value || '').trim() : ''; };
      var p = korbanPayloadDariRow(row);
      p.Diagnosa = g('diagnosa'); p.Kecamatan = g('kecamatan'); p.Lokasi_Kejadian = g('lokasiKejadian'); p.Lokasi_Perawatan = g('lokasiPerawatan');
      p.Rujukan = g('rujukan'); p.Kewarganegaraan = g('wn') || 'WNI';
      btn.disabled = true;
      api('updateKorban', getToken(), row.id, p, row.version).then(function (res) {
        btn.disabled = false;
        if (!res.success) { toast(res.message, 'fail'); return; }
        editId = null; toast(res.message, 'ok'); load();
      });
    }

    function load() {
      var p = { search: st.search, dari: st.dari, sampai: st.sampai, idKabupaten: st.kab, status: st.status, page: st.page, pageSize: st.pageSize };
      api('getKorban', getToken(), p).then(function (r) {
        var b = $('#kb-body', div);
        if (!b) return;
        if (!r.success) { b.innerHTML = emptyState(r.message); return; }
        lastD = r.data; opsi = r.data.opsi;
        gambar(lastD);
      });
    }
    window.KORBAN_MUAT_ULANG = function () { if (document.body.contains(div)) { editId = null; load(); } };

    $('#kb-apply', div).onclick = function () { st.search = $('#kb-q', div).value; st.dari = $('#kb-dari', div).value; st.sampai = $('#kb-sampai', div).value; st.kab = tinggi ? $('#kb-kab', div).value : ''; st.page = 1; editId = null; load(); };
    $('#kb-reset', div).onclick = function () { st.search = ''; st.dari = ''; st.sampai = ''; st.kab = ''; st.status = ''; st.page = 1; editId = null; ['#kb-q', '#kb-dari', '#kb-sampai'].concat(tinggi ? ['#kb-kab'] : []).forEach(function (s) { $(s, div).value = ''; }); load(); };
    $('#kb-q', div).addEventListener('input', debounce(function () { st.search = $('#kb-q', div).value; st.page = 1; editId = null; load(); }, 300));
    $('#kb-add', div).onclick = function () { bukaFormKorban(null, opsi, load); };   // [PERUBAHAN KORBAN] Tambah Data dibuka di halaman baru
    $('#kb-xls', div).onclick = function () {
      api('exportMenuData', getToken(), 'M25', { search: st.search, dari: st.dari, sampai: st.sampai, idKabupaten: st.kab }).then(function (r) {
        if (r.success) { download(r.data.nama, r.data.csv); toast('Berkas Excel (CSV) diunduh.', 'ok'); } else toast(r.message, 'fail');
      });
    };
    $('#kb-pdf', div).onclick = function () { window.print(); };
    load();
    return div;
  }

  // ---------- Formulir Tambah/Ubah Korban di halaman (tab) baru ----------
  // Sesi dititipkan sebentar lewat localStorage (pola yang sama dengan formulir SDM Kesehatan). Untuk mode ubah, baris yang diedit ikut dititipkan.
  function bukaFormKorban(row, opsi, onDone) {
    var KEY = 'indakris_handoff', KEYR = 'indakris_korban_row';
    try {
      localStorage.setItem(KEY, JSON.stringify({ t: getToken(), u: sessionStorage.getItem('indakris_user'), exp: Date.now() + 120000 }));
      if (row) localStorage.setItem(KEYR, JSON.stringify({ row: row, opsi: opsi, exp: Date.now() + 120000 }));
      setTimeout(function () { try { localStorage.removeItem(KEY); localStorage.removeItem(KEYR); } catch (e) {} }, 120000);
    } catch (e) {}
    bukaTab('korban', 'TDM', function () {
      try { localStorage.removeItem(KEY); localStorage.removeItem(KEYR); } catch (e) {}
      var md = modal({ title: row ? 'Ubah Data Korban — ' + row.id : 'Tambah Data Korban' });
      renderFormKorban(md.body, { row: row, opsi: opsi, onSelesai: function () { md.close(); if (onDone) onDone(); } });   // cadangan bila tab baru diblokir browser
    }, '');
  }

  // Titik masuk di tab baru (?page=form&f=korban)
  function formKorbanTab() {
    var host = $('#fp-isi'), row = null, opsi = null;
    ambilTitipanSesi();
    if (!getToken()) {
      host.innerHTML = '<div class="card" style="padding:20px"><div class="note-info"><i class="fa fa-lock"></i><span>Sesi login tidak ditemukan di tab ini. Tutup halaman ini, login kembali di dashboard, lalu klik <b>Tambah Data</b> lagi.</span></div></div>';
      return;
    }
    try {
      var tersimpan = sessionStorage.getItem('indakris_korban_tab');
      var raw = localStorage.getItem('indakris_korban_row');
      if (raw) {
        localStorage.removeItem('indakris_korban_row');
        var h = JSON.parse(raw);
        if (h && h.row && h.exp >= Date.now()) { tersimpan = JSON.stringify({ row: h.row, opsi: h.opsi }); sessionStorage.setItem('indakris_korban_tab', tersimpan); }
      }
      if (tersimpan) { var o = JSON.parse(tersimpan); row = o.row || null; opsi = o.opsi || null; }
    } catch (e) {}
    if (row) {
      var sub = document.querySelector('.fp-sub'); if (sub) sub.textContent = 'Ubah Data Korban';
      document.title = 'Ubah Data Korban \u2014 INDAKRIS NTT';
    }
    renderFormKorban(host, { row: row, opsi: opsi, onSelesai: null });
  }

  // Formulir: bagian atas (Tanggal Kejadian Awal, Kabupaten), bagian bawah (rincian korban, bisa ditambah baris).
  // Data hasil RHA (row dengan penanda RHA): isian dasar TERKUNCI (hanya baca), sisanya dapat dilengkapi.
  function renderFormKorban(host, opts) {
    var row = opts.row || null, edit = !!row, rha = !!(row && korbanDariRha(row));
    var tinggi = !!(state.user && (state.user.role === 'SUPER_ADMIN' || state.user.role === 'ADMIN_PROVINSI'));
    var idkAkun = edit ? String(row.idKab || '') : String((state.user && state.user.idKabupaten) || '');
    var opsi = null, kabList = [], kabNama = '', items = [], seq = 0;
    window.KORBAN_KOTOR = false;
    var kotor = function () { window.KORBAN_KOTOR = true; };
    host.innerHTML = '<div class="card" style="padding:20px"><div class="empty"><i class="fa fa-spinner fa-spin"></i>Memuat formulir...</div></div>';

    function baru() { return { key: ++seq, nama: '', jk: '', usia: '', bln: '', status: '', diag: '', alamat: '', kec: '', lokkej: '', lokraw: '', ruj: '', wn: 'WNI', req: null }; }
    function dariRow(r) {
      var s = function (x) { return x === null || x === undefined ? '' : String(x); };
      return { key: ++seq, nama: s(r.nama), jk: s(r.jk), usia: s(r.usia), bln: s(r.usiaBulan), status: s(r.statusAwal), diag: s(r.diagnosa), alamat: s(r.alamat), kec: s(r.kecamatan),
        lokkej: s(r.lokasiKejadian), lokraw: s(r.lokasiPerawatan), ruj: s(r.rujukan), wn: s(r.wn) || 'WNI', req: null };
    }

    function mulai() {
      var siap = function () { opsi = korbanOpsi(opsi); items = [edit ? dariRow(row) : baru()]; gambar(); };
      var muatOpsi = function () {
        if (opts.opsi) { opsi = opts.opsi; return siap(); }
        api('getKorban', getToken(), { page: 1, pageSize: 1 }).then(function (r) {
          if (!r.success) { host.innerHTML = '<div class="card">' + emptyState(r.message || 'Gagal memuat formulir.') + '</div>'; return; }
          opsi = r.data.opsi; siap();
        });
      };
      if (tinggi) api('getKabupatenPublik').then(function (rk) { kabList = rk && rk.success && rk.data && rk.data.kabupaten ? rk.data.kabupaten : []; muatOpsi(); });
      else namaKab(idkAkun, function (n) { kabNama = n; muatOpsi(); });
    }

    var KUNCI = ' <i class="fa fa-lock" title="Terisi otomatis dari Menu RHA (hanya baca)" style="font-size:10px;color:var(--ink-soft)"></i>';
    function lbl(t, req, kunci) { return esc(t) + (req && !kunci ? ' <span class="req">*</span>' : '') + (kunci ? KUNCI : ''); }

    function gambar() {
      var tgl = edit ? String(row.tgl || '').substring(0, 10) : today();
      var kabHtml = tinggi
        ? '<select id="kf-kab"' + (rha ? ' disabled' : '') + ' data-testid="field-ID_Kabupaten"><option value="">— Pilih —</option>' + kabList.map(function (k) { return '<option value="' + esc(k.id) + '"' + (String(idkAkun) === String(k.id) ? ' selected' : '') + '>' + esc(k.nama) + '</option>'; }).join('') + '</select>'
        : '<select id="kf-kab" disabled data-testid="field-ID_Kabupaten"><option value="' + esc(idkAkun) + '">' + esc(kabNama || 'Sesuai wilayah akun') + '</option></select>';
      host.innerHTML = '<div class="card sdm-card"><div class="card-pad">' +
        (rha ? '<div class="note-info" style="margin-top:0"><i class="fa fa-link"></i><span>Data ini <b>hasil integrasi dari Menu RHA</b>. Isian bertanda <i class="fa fa-lock"></i> terisi otomatis dan hanya baca; lengkapi kolom lainnya.</span></div>' : '') +
        '<div class="sdm-sec" style="margin-top:0;border-top:0;padding-top:0"><span>Data Kejadian</span></div>' +
        '<div class="form-grid">' +
        '<div class="field"><label>' + lbl('Tanggal Kejadian Awal', 1, rha) + '</label><input type="date" id="kf-tgl" value="' + esc(tgl) + '" max="' + today() + '"' + (rha ? ' disabled' : '') + ' data-testid="field-Tgl_Kejadian_Awal"></div>' +
        '<div class="field"><label>' + lbl('Kabupaten / Kota', tinggi, rha || !tinggi) + '</label>' + kabHtml + (tinggi || rha ? '' : '<div class="hint">Terkunci sesuai wilayah akun Anda.</div>') + '</div>' +
        '</div>' +
        '<div class="sdm-sec"><span>Data Korban</span></div><div id="kf-rows"></div>' +
        '</div><div class="sdm-foot"><button class="btn btn-primary" id="kf-simpan" data-testid="korban-save"><i class="fa fa-save"></i> ' + (edit ? 'Simpan Perubahan' : 'Simpan') + '</button></div></div>';
      $('#kf-tgl', host).oninput = kotor;
      if (tinggi && !rha) $('#kf-kab', host).onchange = kotor;
      $('#kf-simpan', host).onclick = simpan;
      gambarBaris();
    }

    function gambarBaris() {
      var box = $('#kf-rows', host);
      box.innerHTML = '';
      items.forEach(function (it, idx) {
        var kc = rha;   // kunci isian dasar (hasil RHA)
        var ro = kc ? ' readonly' : '', dis = kc ? ' disabled' : '';
        var r = el('<div class="kb-item" data-k="' + it.key + '">' +
          '<div class="kb-item-head"><span>Korban ' + (idx + 1) + '</span>' + (!edit && items.length > 1 ? '<button type="button" class="btn btn-ghost btn-sm kb-del" title="Hapus baris ini" aria-label="Hapus baris ini" style="margin-left:auto"><i class="fa fa-trash"></i></button>' : '') + '</div>' +
          '<div class="kb-grid">' +
          '<div class="field"><label>' + lbl('Nama', 1, kc) + '</label><input class="kb-nama" maxlength="150" value="' + esc(it.nama) + '"' + ro + ' data-testid="field-Nama"></div>' +
          '<div class="field"><label>' + lbl('Jenis Kelamin', 1, kc) + '</label><select class="kb-jk"' + dis + ' data-testid="field-Jenis_Kelamin">' + opsiKorbanHtml(opsi.jk, it.jk, '— Pilih —') + '</select></div>' +
          '<div class="field"><label>' + lbl('Usia', 1, kc) + '</label><div class="kb-usia"><input type="number" min="0" max="120" class="kb-usia-th" placeholder="tahun" value="' + esc(it.usia) + '"' + ro + ' data-testid="field-Usia">' +
          '<input type="number" min="0" max="11" class="kb-usia-bln" placeholder="bulan" value="' + esc(it.bln) + '"' + ro + ' style="display:none" data-testid="field-Usia_Bulan"></div><div class="hint">Bayi di bawah 1 tahun: isi 0, lalu isi bulan.</div></div>' +
          '<div class="field"><label>' + lbl('Kategori Usia', 0, kc) + '</label><input class="kb-kat" readonly placeholder="Otomatis dari usia" data-testid="field-Kategori_Usia"></div>' +
          '<div class="field"><label>' + lbl('Status Awal', 1, kc) + '</label><select class="kb-status"' + dis + ' data-testid="field-Status_Awal">' + opsiKorbanHtml(opsi.statusAwal, it.status, '— Pilih —') + '</select></div>' +
          '<div class="field"><label>' + lbl('Diagnosa/Keterangan') + '</label><textarea class="kb-ta kb-diag" rows="1" maxlength="500" data-testid="field-Diagnosa">' + esc(it.diag) + '</textarea></div>' +
          '<div class="field"><label>' + lbl('Alamat', 0, kc) + '</label><textarea class="kb-ta kb-alamat" rows="1" maxlength="300"' + ro + ' data-testid="field-Alamat_Korban">' + esc(it.alamat) + '</textarea></div>' +
          '<div class="field"><label>' + lbl('Kecamatan') + '</label><textarea class="kb-ta kb-kec" rows="1" maxlength="100" data-testid="field-Kecamatan">' + esc(it.kec) + '</textarea></div>' +
          '<div class="field"><label>' + lbl('Lokasi Kejadian') + '</label><textarea class="kb-ta kb-lokkej" rows="1" maxlength="300" data-testid="field-Lokasi_Kejadian">' + esc(it.lokkej) + '</textarea></div>' +
          '<div class="field"><label>' + lbl('Lokasi Perawatan') + '</label><textarea class="kb-ta kb-lokraw" rows="1" maxlength="200" data-testid="field-Lokasi_Perawatan">' + esc(it.lokraw) + '</textarea></div>' +
          '<div class="field"><label>' + lbl('Rujukan') + '</label><select class="kb-ruj" data-testid="field-Rujukan">' + opsiKorbanHtml(KORBAN_RUJUKAN, it.ruj, '-- Pilih --') + '</select></div>' +
          '<div class="field"><label>' + lbl('Kewarganegaraan', 1) + '</label><div class="kb-wn-in"><select class="kb-wn" data-testid="field-Kewarganegaraan">' + opsiKorbanHtml(opsi.wn, it.wn) + '</select>' +
          (edit ? '' : '<button type="button" class="btn btn-add btn-sm kb-plus" title="Tambah baris korban" aria-label="Tambah baris korban"><i class="fa fa-plus"></i></button>') + '</div></div>' +
          '</div></div>');
        box.appendChild(r);
        var q = function (s) { return $(s, r); };
        var th = q('.kb-usia-th'), bln = q('.kb-usia-bln'), kat = q('.kb-kat');
        function sinkron() {
          var u = String(it.usia).trim(), bayi = u !== '' && !isNaN(Number(u)) && Number(u) >= 0 && Number(u) <= 1;
          bln.style.display = bayi ? '' : 'none';
          if (!bayi && !kc) { it.bln = ''; bln.value = ''; }
          kat.value = (kc && row.kategori) ? row.kategori : katUsiaKorban(opsi, u, String(it.bln).trim());
        }
        th.addEventListener('input', function () { it.usia = th.value; sinkron(); kotor(); });
        bln.addEventListener('input', function () { it.bln = bln.value; sinkron(); kotor(); });
        sinkron();
        [['.kb-nama', 'nama'], ['.kb-jk', 'jk'], ['.kb-status', 'status'], ['.kb-diag', 'diag'], ['.kb-alamat', 'alamat'], ['.kb-kec', 'kec'],
          ['.kb-lokkej', 'lokkej'], ['.kb-lokraw', 'lokraw'], ['.kb-ruj', 'ruj'], ['.kb-wn', 'wn']].forEach(function (m) {
          var n = q(m[0]);
          n.addEventListener(n.tagName === 'SELECT' ? 'change' : 'input', function () { it[m[1]] = n.value; kotor(); });
        });
        var bp = q('.kb-plus'), bd = q('.kb-del');
        if (bp) bp.onclick = function () {
          items.splice(items.indexOf(it) + 1, 0, baru()); gambarBaris();
          var rs = $('#kf-rows', host).querySelectorAll('.kb-item'), n = rs[items.indexOf(it) + 1];
          if (n) { var f = $('.kb-nama', n); if (f) f.focus(); }
        };
        if (bd) bd.onclick = function () { items.splice(items.indexOf(it), 1); gambarBaris(); kotor(); };
      });
      pasangAutoGrow(box);
    }

    function payloadDari(it, tgl, kab) {
      var p = rha ? korbanPayloadDariRow(row) : {
        Tgl_Kejadian_Awal: tgl, Nama: it.nama.trim(), Jenis_Kelamin: it.jk, Usia: String(it.usia).trim(), Usia_Bulan: Number(it.usia) <= 1 ? String(it.bln).trim() : '',
        Status_Awal: it.status, ID_Kabupaten: kab, Alamat_Korban: it.alamat.trim(), Tujuan_Rujukan: edit ? String(row.tujuanRujukan || '') : ''
      };
      p.Diagnosa = it.diag.trim(); p.Kecamatan = it.kec.trim(); p.Lokasi_Kejadian = it.lokkej.trim(); p.Lokasi_Perawatan = it.lokraw.trim();
      p.Rujukan = it.ruj; p.Kewarganegaraan = it.wn || 'WNI';
      return p;
    }

    function cek(tgl, kab) {
      if (rha) return '';   // isian dasar berasal dari RHA dan sudah divalidasi saat diteruskan
      if (!tgl) return 'Kolom wajib belum diisi: Tanggal Kejadian Awal';
      if (tgl > today()) return 'Tanggal Kejadian Awal tidak boleh melewati hari ini.';
      if (tinggi && !kab) return 'Kolom wajib belum diisi: Kabupaten / Kota';
      for (var i = 0; i < items.length; i++) {
        var s = korbanCek(payloadDari(items[i], tgl, kab), tinggi, items.length > 1 ? ' (korban ' + (i + 1) + ')' : '');
        if (s) return s.msg;
      }
      return '';
    }

    function selesai(n, pesan) {
      window.KORBAN_KOTOR = false;
      try { localStorage.setItem('indakris_korban_ping', String(Date.now())); sessionStorage.removeItem('indakris_korban_tab'); } catch (e) {}
      var keluar = opts.onSelesai || tutupHalaman;
      host.innerHTML = '<div class="card" id="fp-selesai" style="padding:28px;text-align:center"><div style="font-size:44px;color:var(--green)"><i class="fa fa-circle-check"></i></div>' +
        '<div class="card-title" style="margin:8px 0">Data tersimpan</div><p style="color:var(--ink-soft)">' + esc(pesan || (n + ' data korban berhasil disimpan.')) + '</p>' +
        '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">' + (edit ? '' : '<button class="btn btn-primary" id="kf-lagi"><i class="fa fa-rotate-right"></i> Tambah Data Lagi</button>') +
        '<button class="btn btn-ghost" id="kf-tutup">' + (opts.onSelesai ? 'Tutup' : 'Tutup Halaman') + '</button></div></div>';
      var lagi = $('#kf-lagi', host);
      if (lagi) lagi.onclick = function () { row = null; edit = false; rha = false; items = [baru()]; gambar(); };
      $('#kf-tutup', host).onclick = keluar;
    }

    function simpan() {
      var tgl = rha ? String(row.tgl || '').substring(0, 10) : $('#kf-tgl', host).value;
      var kab = rha ? idkAkun : (tinggi ? $('#kf-kab', host).value : idkAkun);
      var err = cek(tgl, kab);
      if (err) { toast(err, 'fail'); return; }
      var b = $('#kf-simpan', host); b.disabled = true;
      var bukaTombol = function () { var x = $('#kf-simpan', host); if (x) x.disabled = false; };

      if (edit) {   // mode ubah: satu data
        api('updateKorban', getToken(), row.id, payloadDari(items[0], tgl, kab), row.version).then(function (res) {
          if (!res || !res.success) { toast((res && res.message) || 'Gagal menyimpan.', 'fail'); bukaTombol(); return; }
          selesai(1, res.message);
        });
        return;
      }
      var berhasil = 0, total = items.length;
      (function kirim() {
        var it = items[0];
        if (!it) { selesai(berhasil); return; }
        if (!it.req) it.req = 'req-' + Date.now() + '-' + Math.random().toString(36).slice(2);   // ID permintaan tetap per baris: kirim ulang tidak menggandakan data
        api('saveKorban', getToken(), payloadDari(it, tgl, kab), it.req).then(function (res) {
          if (!res || !res.success) {
            toast((res && res.message ? res.message : 'Gagal menyimpan.') + (berhasil ? ' ' + berhasil + ' dari ' + total + ' baris sudah tersimpan; sisanya masih di formulir.' : ''), 'fail');
            gambarBaris(); bukaTombol(); return;
          }
          berhasil++; items.shift(); kirim();
        });
      })();
    }

    mulai();
  }

  // Validasi: server memeriksa kelengkapan dan konsistensi; bila lolos status menjadi Tervalidasi
  function validasiKorbanUI(row, opsi, onDone) {
    confirmDlg('Validasi Data Korban', 'Validasi data korban <b>' + esc(row.nama) + '</b> (' + esc(row.id) + ')?<br>Sistem akan memeriksa kelengkapan dan konsistensi data lebih dulu. Data yang sudah divalidasi tidak dapat diubah atau dihapus oleh admin biasa.', function () {
      api('validasiKorban', getToken(), row.id).then(function (res) {
        if (res.success) { toast(res.message, 'ok'); onDone(); return; }
        if (!res.masalah || !res.masalah.length) { toast(res.message, 'fail'); return; }
