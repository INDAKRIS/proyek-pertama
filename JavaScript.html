        var md = modal({ title: 'Data Belum Dapat Divalidasi', narrow: true });
        md.body.innerHTML = '<div style="line-height:1.6;margin-bottom:8px">' + esc(res.message) + '</div><ul style="margin:0;padding-left:20px;line-height:1.7">' +
          res.masalah.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>';
        var bTutup = el('<button class="btn btn-ghost">Tutup</button>'); bTutup.onclick = md.close;
        md.foot.appendChild(bTutup);
        if (row.aksi && row.aksi.edit) {
          var bEdit = el('<button class="btn btn-primary"><i class="fa fa-pen"></i> Perbaiki Data</button>');
          bEdit.onclick = function () { md.close(); bukaFormKorban(row, opsi, onDone); };
          md.foot.appendChild(bEdit);
        }
      });
    }, 'Ya, Validasi');
  }

  function detailKorban(row) {
    var md = modal({ title: 'Detail Korban — ' + row.id });
    var kv = [['ID Record', esc(row.id)], ['Status Data', korbanBadge(row.status)]];
    KORBAN_KOLOM.forEach(function (c) { var x = c[0] === 'usia' ? fmtUsiaKorban(row) : row[c[0]]; kv.push([c[1], esc(x === '' || x === null || x === undefined ? '—' : x)]); });
    kv.push(['Dibuat', esc(row.dibuatPada || '—') + (row.dibuatOleh ? ' oleh ' + esc(row.dibuatOleh) : '')]);
    if (row.divalidasiOleh) kv.push(['Divalidasi', esc(row.divalidasiPada || '') + ' oleh ' + esc(row.divalidasiOleh)]);
    md.body.innerHTML = '<dl class="kv">' + kv.map(function (x) { return '<dt>' + esc(x[0]) + '</dt><dd>' + x[1] + '</dd>'; }).join('') + '</dl>';
  }

  // ============ Menu Faskes (Kondisi) (M02): tabel + formulir di HALAMAN BARU + edit langsung data hasil RHA + Verifikasi/Validasi ============
  // [PERUBAHAN FASKES] Urutan kolom tabel = urutan isian pada formulir Tambah Data.
  var FASKES_KOLOM = [['tgl', 'Tanggal Kejadian Awal'], ['kabupaten', 'Kabupaten'], ['nama', 'Nama Faskes'], ['kondisi', 'Kondisi Faskes'], ['alamat', 'Alamat'], ['kecamatan', 'Kecamatan']];
  var FASKES_TEKS_PANJANG = { alamat: 1, kecamatan: 1, nama: 1 };
  var FASKES_KONDISI = ['Rusak Berat', 'Rusak Sedang', 'Rusak Ringan'];
  // Kolom yang boleh dilengkapi pada data hasil RHA: [nama field server, panjang maks]. Tanggal, Kabupaten, Nama Faskes, Kondisi TERKUNCI (hanya baca).
  var FASKES_EDIT_RHA = { alamat: ['Alamat', 300], kecamatan: ['Kecamatan', 100] };

  function faskesDariRha(row) { return !!(row && row.sumberRha); }
  function faskesOpsi(o) { o = o || {}; return { kondisi: o.kondisi && o.kondisi.length ? o.kondisi : FASKES_KONDISI, faskes: o.faskes || [] }; }
  function faskesBadge(s) {
    s = statusTampil(s);
    var cls = { 'Diajukan': 'badge-diajukan', 'Terverifikasi': 'badge-terverifikasi', 'Tervalidasi': 'badge-tervalidasi', 'Dikembalikan': 'badge-dikembalikan' }[s] || 'badge-draft';
    return '<span class="badge ' + cls + '">' + esc(s === 'Diajukan' ? 'Menunggu Verifikasi' : (s || '—')) + '</span>';
  }
  function faskesPayloadDariRow(row) {
    var s = function (x) { return x === null || x === undefined ? '' : String(x); };
    return { Tanggal: s(row.tgl).substring(0, 10), ID_Kabupaten: s(row.idKab), Nama_Faskes: s(row.nama), Kondisi_Faskes: s(row.kondisi), Alamat: s(row.alamat), Kecamatan: s(row.kecamatan) };
  }
  window.addEventListener('storage', function (e) {
    if (e && e.key === 'indakris_faskes_ping' && typeof window.FASKES_MUAT_ULANG === 'function') window.FASKES_MUAT_ULANG();
  });

  function pageFaskes() {
    var st = state.menuPage.M02 = state.menuPage.M02 || { search: '', dari: '', sampai: '', kab: '', status: '', page: 1, pageSize: 20 };
    var tinggi = state.user.role === 'SUPER_ADMIN' || state.user.role === 'ADMIN_PROVINSI';
    if (!tinggi) st.kab = '';
    var opsi = null, byId = {}, lastD = null, editId = null;
    var div = el('<div></div>');
    div.innerHTML = '<div class="page-head"><div><h2 class="page-title" data-testid="page-title">FASKES (KONDISI)</h2><div class="page-sub">Informasi Data Krisis Kesehatan NTT</div>' +
      '<div class="scope-line" style="margin-top:6px"><span class="dot"></span>Wilayah aktif <span class="js-wil-fk">' + esc(state.user.idKabupaten || 'Provinsi NTT') + '</span> &nbsp;&bull;&nbsp; <i class="fa fa-clock" style="margin-right:4px"></i>' + nowStr() + '</div></div>' +
      '<div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn btn-export btn-sm" id="fk-pdf"><i class="fa fa-file-pdf"></i> PDF</button>' +
      '<button class="btn btn-export btn-sm" id="fk-xls"><i class="fa fa-file-excel"></i> Excel</button>' +
      '<button class="btn btn-add" id="fk-add" data-testid="add-data-button"><i class="fa fa-plus"></i> Tambah Data</button></div></div>' +
      '<div class="card"><div class="card-pad"><div class="filter-row">' +
      '<div class="field" style="margin:0"><label>Pencarian</label><input id="fk-q" placeholder="Cari nama faskes, alamat, kecamatan..." value="' + esc(st.search) + '" data-testid="menu-search"></div>' +
      '<div class="field" style="margin:0"><label>Dari Tanggal</label><input type="date" id="fk-dari" value="' + st.dari + '"></div>' +
      '<div class="field" style="margin:0"><label>Sampai Tanggal</label><input type="date" id="fk-sampai" value="' + st.sampai + '"></div>' +
      '<div class="field" style="margin:0"><label>Kabupaten / Kota</label>' + (tinggi ? '<select id="fk-kab"><option value="">Semua Wilayah</option></select>' : '<select id="fk-kab" disabled title="Data dibatasi pada wilayah akun Anda"><option value="">…</option></select>') + '</div>' +
      '<button class="btn btn-primary btn-sm" id="fk-apply" data-testid="apply-filter">Terapkan</button>' +
      '<button class="btn btn-ghost btn-sm" id="fk-reset" data-testid="reset-filter">Reset</button></div>' +
      '<div class="note-info"><i class="fa fa-circle-info"></i><span>Data baru berstatus <b>Menunggu Verifikasi</b>. Data <b>hasil integrasi Menu RHA</b> tampil otomatis dengan kolom Tanggal, Kabupaten, Nama Faskes, dan Kondisi terkunci; klik <b>Edit</b> untuk melengkapi <b>Alamat</b> dan <b>Kecamatan</b>.</span></div>' +
      '<div id="fk-tabs" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"></div>' +
      '<div id="fk-body"><div class="empty"><i class="fa fa-spinner fa-spin"></i>Memuat data...</div></div>' +
      '<div class="pager" id="fk-pager"></div></div></div>';

    if (tinggi) {
      api('getKabupatenPublik').then(function (r) {
        var sel = $('#fk-kab', div);
        if (r.success) r.data.kabupaten.forEach(function (k) { sel.appendChild(el('<option value="' + esc(k.id) + '">' + esc(k.nama) + '</option>')); });
        sel.value = st.kab;
      });
    } else {
      namaKab(state.user.idKabupaten, function (n) { $('#fk-kab', div).innerHTML = '<option value="">' + esc(n) + '</option>'; });
    }
    namaKab(state.user.idKabupaten, function (n) { var x = $('.js-wil-fk', div); if (x) x.textContent = n; });

    function celBiasa(c, row, rha) {
      var v = row[c[0]], kosong = (v === '' || v === null || v === undefined);
      var gaya = FASKES_TEKS_PANJANG[c[0]] ? ' style="min-width:170px;white-space:normal"' : '';
      var cls = kosong && rha && FASKES_EDIT_RHA[c[0]] ? ' class="kb-kosong"' : '';
      var chip = c[0] === 'nama' && rha ? '<span class="kb-chip-rha" title="Data hasil integrasi Menu RHA">RHA</span>' : '';
      return '<td' + gaya + cls + '>' + esc(kosong ? '—' : v) + chip + '</td>';
    }
    function celEdit(c, row) {
      var d = FASKES_EDIT_RHA[c[0]], v = row[c[0]] === null || row[c[0]] === undefined ? '' : String(row[c[0]]);
      return '<td style="min-width:220px;white-space:normal"><textarea class="kb-ie" rows="1" maxlength="' + d[1] + '" data-f="' + c[0] + '">' + esc(v) + '</textarea></td>';
    }

    function gambar(d) {
      var b = $('#fk-body', div);
      $('#fk-add', div).style.display = d.izin.tambah ? 'inline-flex' : 'none';
      var tabs = [['', 'Semua (' + d.counts.total + ')'], ['Diajukan', 'Menunggu Verifikasi (' + d.counts.diajukan + ')'], ['Terverifikasi', 'Terverifikasi (' + d.counts.terverifikasi + ')']];
      if (bolehValidasiUI()) tabs.push(['Tervalidasi', 'Tervalidasi (' + d.counts.tervalidasi + ')']);
      $('#fk-tabs', div).innerHTML = tabs.map(function (t) { return '<span class="chip" data-st="' + t[0] + '" style="cursor:pointer;' + (st.status === t[0] ? 'background:var(--primary);color:#fff' : '') + '">' + esc(t[1]) + '</span>'; }).join('');
      Array.prototype.forEach.call($('#fk-tabs', div).querySelectorAll('[data-st]'), function (t) { t.onclick = function () { st.status = t.getAttribute('data-st'); st.page = 1; editId = null; load(); }; });
      if (!d.rows.length && d.total > 0 && st.page > 1) { st.page = Math.max(1, Math.ceil(d.total / st.pageSize)); load(); return; }
      if (!d.rows.length) { b.innerHTML = emptyState('Belum ada data faskes (kondisi) pada lingkup Anda.'); $('#fk-pager', div).innerHTML = ''; return; }
      byId = {};
      d.rows.forEach(function (x) { byId[x.id] = x; });
      var head = '<th>No</th>' + FASKES_KOLOM.map(function (c) { return '<th>' + esc(c[1]) + '</th>'; }).join('') + '<th>Status</th><th>Aksi</th>';
      var body = d.rows.map(function (row, i) {
        var rha = faskesDariRha(row), a = row.aksi || {}, editing = editId === row.id && rha && a.edit;
        var tds = FASKES_KOLOM.map(function (c) { return (editing && FASKES_EDIT_RHA[c[0]]) ? celEdit(c, row) : celBiasa(c, row, rha); }).join('');
        var aksi = editing
          ? '<button class="btn btn-primary btn-sm" data-act="simpan" data-testid="faskes-inline-save"><i class="fa fa-save"></i> Simpan</button><button class="btn btn-ghost btn-sm" data-act="batal">Batal</button>'
          : (a.edit ? '<button class="btn btn-ghost btn-sm" data-act="edit" data-testid="faskes-edit"><i class="fa fa-pen"></i> Edit</button>' : '') +
            (a.verifikasi && bolehVerifikasiUI() ? '<button class="btn btn-primary btn-sm" data-act="verifikasi" data-testid="faskes-verifikasi"><i class="fa fa-clipboard-check"></i> Verifikasi</button>' : '') +
            (a.validasi && bolehValidasiUI() ? '<button class="btn btn-primary btn-sm" data-act="validasi" data-testid="faskes-validasi"><i class="fa fa-circle-check"></i> Validasi</button>' : '') +
            (a.hapus ? '<button class="btn btn-ghost btn-sm" data-act="hapus" data-testid="faskes-hapus" style="color:#c0392b"><i class="fa fa-trash"></i> Hapus</button>' : '');
        return '<tr data-testid="menu-row" class="rowlink' + (editing ? ' kb-editing' : '') + '" data-id="' + esc(row.id) + '"><td>' + ((d.page - 1) * d.pageSize + i + 1) + '</td>' + tds +
          '<td>' + faskesBadge(row.status) + '</td><td><div style="display:flex;gap:6px;flex-wrap:nowrap">' + aksi + '</div></td></tr>';
      }).join('');
      b.innerHTML = '<div class="table-wrap"><table class="grid" style="min-width:1500px"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>';
      pasangAutoGrow(b);

      var pr = $('#fk-pager', div), pages = Math.max(1, Math.ceil(d.total / d.pageSize));
      pr.innerHTML = '<span class="pager-info">Menampilkan ' + ((d.page - 1) * d.pageSize + 1) + '–' + Math.min(d.page * d.pageSize, d.total) + ' dari ' + fmt(d.total) + ' data</span>' +
        '<button class="pg" ' + (d.page <= 1 ? 'disabled' : '') + ' data-p="prev"><i class="fa fa-chevron-left"></i></button>' +
        Array.from({ length: Math.min(pages, 7) }, function (_, i) { var n = Math.max(1, Math.min(d.page - 3, pages - 6)) + i; return '<button class="pg ' + (n === d.page ? 'active' : '') + '" data-p="' + n + '">' + n + '</button>'; }).join('') +
        '<button class="pg" ' + (d.page >= pages ? 'disabled' : '') + ' data-p="next"><i class="fa fa-chevron-right"></i></button>' +
        '<select class="mini-select" id="fk-ps"><option>20</option><option>50</option><option>100</option></select><span style="color:var(--ink-soft);font-size:12px">data per halaman</span>';
      $('#fk-ps', div).value = String(st.pageSize);
      $('#fk-ps', div).onchange = function () { st.pageSize = Number($('#fk-ps', div).value); st.page = 1; editId = null; load(); };
      Array.prototype.forEach.call(pr.querySelectorAll('[data-p]'), function (btn) { btn.onclick = function () { var v = btn.getAttribute('data-p'); st.page = v === 'prev' ? d.page - 1 : v === 'next' ? d.page + 1 : Number(v); editId = null; load(); }; });

      Array.prototype.forEach.call(b.querySelectorAll('tr[data-id]'), function (tr) {
        tr.onclick = function (e) {
          var row = byId[tr.getAttribute('data-id')];
          if (!row) return;
          var act = e.target.closest('[data-act]');
          if (!act) {
            if (tr.classList.contains('kb-editing') || e.target.closest('textarea,select,input')) return;
            detailFaskes(row); return;
          }
          var a = act.getAttribute('data-act');
          if (a === 'edit') {
            if (faskesDariRha(row)) { editId = row.id; gambar(lastD); var f0 = $('tr.kb-editing .kb-ie', b); if (f0) f0.focus(); }   // data RHA: lengkapi langsung di tabel
            else bukaFormFaskes(row, opsi, load);                                                                                      // data manual: formulir di halaman baru
          } else if (a === 'batal') { editId = null; gambar(lastD); }
          else if (a === 'simpan') simpanInline(row, tr, act);
          else if (a === 'verifikasi') confirmDlg('Verifikasi Data Faskes', 'Verifikasi data kondisi <b>' + esc(row.nama) + '</b> (' + esc(row.kabupaten) + ')?<br>Setelah diverifikasi, data dapat divalidasi oleh Admin Provinsi atau Super Admin.', function () {
            api('verifikasiFaskesKondisi', getToken(), row.id).then(function (res) { toast(res.message, res.success ? 'ok' : 'fail'); if (res.success) load(); });
          }, 'Ya, Verifikasi');
          else if (a === 'validasi') validasiFaskesUI(row, opsi, load);
          else if (a === 'hapus') confirmDlg('Hapus Data Faskes', 'Data kondisi <b>' + esc(row.nama) + '</b> (' + esc(row.id) + ') akan dihapus (soft delete) dan tercatat di log audit. Lanjutkan?', function () {
            api('hapusFaskesKondisi', getToken(), row.id).then(function (res) { toast(res.message, res.success ? 'ok' : 'fail'); if (res.success) load(); });
          }, 'Hapus');
        };
      });
    }

    function simpanInline(row, tr, btn) {
      var g = function (f) { var n = tr.querySelector('[data-f="' + f + '"]'); return n ? String(n.value || '').trim() : ''; };
      var p = faskesPayloadDariRow(row);
      p.Alamat = g('alamat'); p.Kecamatan = g('kecamatan');
      btn.disabled = true;
      api('updateFaskesKondisi', getToken(), row.id, p, row.version).then(function (res) {
        btn.disabled = false;
        if (!res.success) { toast(res.message, 'fail'); return; }
        editId = null; toast(res.message, 'ok'); load();
      });
    }

    function load() {
      var p = { search: st.search, dari: st.dari, sampai: st.sampai, idKabupaten: st.kab, status: st.status, page: st.page, pageSize: st.pageSize };
      api('getFaskesKondisi', getToken(), p).then(function (r) {
        var b = $('#fk-body', div);
        if (!b) return;
        if (!r.success) { b.innerHTML = emptyState(r.message); return; }
        lastD = r.data; opsi = r.data.opsi;
        gambar(lastD);
      });
    }
    window.FASKES_MUAT_ULANG = function () { if (document.body.contains(div)) { editId = null; load(); } };

    $('#fk-apply', div).onclick = function () { st.search = $('#fk-q', div).value; st.dari = $('#fk-dari', div).value; st.sampai = $('#fk-sampai', div).value; st.kab = tinggi ? $('#fk-kab', div).value : ''; st.page = 1; editId = null; load(); };
    $('#fk-reset', div).onclick = function () { st.search = ''; st.dari = ''; st.sampai = ''; st.kab = ''; st.status = ''; st.page = 1; editId = null; ['#fk-q', '#fk-dari', '#fk-sampai'].concat(tinggi ? ['#fk-kab'] : []).forEach(function (s) { $(s, div).value = ''; }); load(); };
    $('#fk-q', div).addEventListener('input', debounce(function () { st.search = $('#fk-q', div).value; st.page = 1; editId = null; load(); }, 300));
    $('#fk-add', div).onclick = function () { bukaFormFaskes(null, opsi, load); };   // Tambah Data dibuka di halaman baru
    $('#fk-xls', div).onclick = function () {
      api('exportFaskesKondisi', getToken(), { search: st.search, dari: st.dari, sampai: st.sampai, idKabupaten: st.kab, status: st.status }).then(function (r) {
        if (r.success) { download(r.data.nama, r.data.csv); toast('Berkas Excel (CSV) diunduh.', 'ok'); } else toast(r.message, 'fail');
      });
    };
    $('#fk-pdf', div).onclick = function () { window.print(); };
    load();
    return div;
  }

  // ---------- Formulir Tambah/Ubah Faskes (Kondisi) di halaman (tab) baru ----------
  function bukaFormFaskes(row, opsi, onDone) {
    var KEY = 'indakris_handoff', KEYR = 'indakris_faskes_row';
    try {
      localStorage.setItem(KEY, JSON.stringify({ t: getToken(), u: sessionStorage.getItem('indakris_user'), exp: Date.now() + 120000 }));
      if (row) localStorage.setItem(KEYR, JSON.stringify({ row: row, opsi: opsi, exp: Date.now() + 120000 }));
      setTimeout(function () { try { localStorage.removeItem(KEY); localStorage.removeItem(KEYR); } catch (e) {} }, 120000);
    } catch (e) {}
    bukaTab('faskes', 'TDM', function () {
      try { localStorage.removeItem(KEY); localStorage.removeItem(KEYR); } catch (e) {}
      var md = modal({ title: row ? 'Ubah Data Faskes (Kondisi) — ' + row.id : 'Tambah Data Faskes (Kondisi)' });
      renderFormFaskes(md.body, { row: row, opsi: null, onSelesai: function () { md.close(); if (onDone) onDone(); } });   // cadangan bila tab baru diblokir browser
    }, '');
  }

  function formFaskesTab() {
    var host = $('#fp-isi'), row = null;
    ambilTitipanSesi();
    if (!getToken()) {
      host.innerHTML = '<div class="card" style="padding:20px"><div class="note-info"><i class="fa fa-lock"></i><span>Sesi login tidak ditemukan di tab ini. Tutup halaman ini, login kembali di dashboard, lalu klik <b>Tambah Data</b> lagi.</span></div></div>';
      return;
    }
    try {
      var tersimpan = sessionStorage.getItem('indakris_faskes_tab');
      var raw = localStorage.getItem('indakris_faskes_row');
      if (raw) {
        localStorage.removeItem('indakris_faskes_row');
        var h = JSON.parse(raw);
        if (h && h.row && h.exp >= Date.now()) { tersimpan = JSON.stringify({ row: h.row }); sessionStorage.setItem('indakris_faskes_tab', tersimpan); }
      }
      if (tersimpan) row = JSON.parse(tersimpan).row || null;
    } catch (e) {}
    if (row) {
      var sub = document.querySelector('.fp-sub'); if (sub) sub.textContent = 'Ubah Data Faskes (Kondisi)';
      document.title = 'Ubah Data Faskes (Kondisi) \u2014 INDAKRIS NTT';
    }
    renderFormFaskes(host, { row: row, opsi: null, onSelesai: null });
  }

  // Bagian atas: Tanggal Kejadian Awal (input manual) + Kabupaten (sesuai akun, hanya baca; Admin Provinsi/Super Admin memilih).
  // Bagian bawah: Nama Faskes, Kondisi Faskes, Alamat, Kecamatan. Data hasil RHA: Tanggal, Kabupaten, Nama Faskes, Kondisi TERKUNCI (hanya baca).
  function renderFormFaskes(host, opts) {
    var row = opts.row || null, edit = !!row, rha = !!(row && faskesDariRha(row));
    var tinggi = !!(state.user && (state.user.role === 'SUPER_ADMIN' || state.user.role === 'ADMIN_PROVINSI'));
    var idkAkun = edit ? String(row.idKab || '') : String((state.user && state.user.idKabupaten) || '');
    var opsi = null, kabList = [], kabNama = '', req = null, v = { nama: '', kondisi: '', alamat: '', kec: '' };
    window.FASKES_KOTOR = false;
    var kotor = function () { window.FASKES_KOTOR = true; };
    host.innerHTML = '<div class="card" style="padding:20px"><div class="empty"><i class="fa fa-spinner fa-spin"></i>Memuat formulir...</div></div>';
    if (edit) { v = { nama: String(row.nama || ''), kondisi: String(row.kondisi || ''), alamat: String(row.alamat || ''), kec: String(row.kecamatan || '') }; }

    function mulai() {
      var muatOpsi = function () {
        api('getFaskesKondisi', getToken(), { page: 1, pageSize: 1, denganFaskes: true }).then(function (r) {
          if (!r.success) { host.innerHTML = '<div class="card">' + emptyState(r.message || 'Gagal memuat formulir.') + '</div>'; return; }
          opsi = faskesOpsi(r.data.opsi); gambar();
        });
      };
      if (tinggi) api('getKabupatenPublik').then(function (rk) { kabList = rk && rk.success && rk.data && rk.data.kabupaten ? rk.data.kabupaten : []; muatOpsi(); });
      else namaKab(idkAkun, function (n) { kabNama = n; muatOpsi(); });
    }
    var KUNCI = ' <i class="fa fa-lock" title="Terisi otomatis dari Menu RHA (hanya baca)" style="font-size:10px;color:var(--ink-soft)"></i>';
    function lbl(t, req_, kunci) { return esc(t) + (req_ && !kunci ? ' <span class="req">*</span>' : '') + (kunci ? KUNCI : ''); }

    function kabAktif() { var s = $('#kf-kab', host); return tinggi && !rha && s ? s.value : idkAkun; }
    function isiDatalist() {
      var dl = $('#kf-dl', host); if (!dl) return;
      var kab = kabAktif();
      dl.innerHTML = opsi.faskes.filter(function (f) { return !kab || String(f[2]) === String(kab); }).map(function (f) { return '<option value="' + esc(f[1]) + '">'; }).join('');
    }

    function gambar() {
      var tgl = edit ? String(row.tgl || '').substring(0, 10) : today();
      var kabHtml = tinggi
        ? '<select id="kf-kab"' + (rha ? ' disabled' : '') + ' data-testid="field-ID_Kabupaten"><option value="">— Pilih —</option>' + kabList.map(function (k) { return '<option value="' + esc(k.id) + '"' + (String(idkAkun) === String(k.id) ? ' selected' : '') + '>' + esc(k.nama) + '</option>'; }).join('') + '</select>'
        : '<select id="kf-kab" disabled data-testid="field-ID_Kabupaten"><option value="' + esc(idkAkun) + '">' + esc(kabNama || 'Sesuai wilayah akun') + '</option></select>';
      host.innerHTML = '<div class="card sdm-card"><div class="card-pad">' +
        (rha ? '<div class="note-info" style="margin-top:0"><i class="fa fa-link"></i><span>Data ini <b>hasil integrasi dari Menu RHA</b>. Isian bertanda <i class="fa fa-lock"></i> terisi otomatis dan hanya baca; lengkapi <b>Alamat</b> dan <b>Kecamatan</b>.</span></div>' : '') +
        '<div class="sdm-sec" style="margin-top:0;border-top:0;padding-top:0"><span>Data Kejadian</span></div>' +
        '<div class="form-grid">' +
        '<div class="field"><label>' + lbl('Tanggal Kejadian Awal', 1, rha) + '</label><input type="date" id="kf-tgl" value="' + esc(tgl) + '" max="' + today() + '"' + (rha ? ' disabled' : '') + ' data-testid="field-Tanggal"></div>' +
        '<div class="field"><label>' + lbl('Kabupaten / Kota', tinggi, rha || !tinggi) + '</label>' + kabHtml + (tinggi || rha ? '' : '<div class="hint">Terkunci sesuai wilayah akun Anda.</div>') + '</div>' +
        '</div>' +
        '<div class="sdm-sec"><span>Data Faskes</span></div>' +
        '<div class="kb-item"><div class="kb-grid">' +
        '<div class="field"><label>' + lbl('Nama Faskes', 1, rha) + '</label><input id="kf-nama" list="kf-dl" maxlength="200" autocomplete="off" placeholder="mis. Puskesmas Soe" value="' + esc(v.nama) + '"' + (rha ? ' readonly' : '') + ' data-testid="field-Nama_Faskes"><datalist id="kf-dl"></datalist></div>' +
        '<div class="field"><label>' + lbl('Kondisi Faskes', 1, rha) + '</label><select id="kf-kond"' + (rha ? ' disabled' : '') + ' data-testid="field-Kondisi_Faskes">' + opsiKorbanHtml(opsi.kondisi, v.kondisi, '— Pilih —') + '</select></div>' +
        '<div class="field"><label>' + lbl('Alamat') + '</label><textarea class="kb-ta" id="kf-alamat" rows="1" maxlength="300" data-testid="field-Alamat">' + esc(v.alamat) + '</textarea></div>' +
        '<div class="field"><label>' + lbl('Kecamatan') + '</label><textarea class="kb-ta" id="kf-kec" rows="1" maxlength="100" data-testid="field-Kecamatan">' + esc(v.kec) + '</textarea></div>' +
        '</div></div>' +
        '</div><div class="sdm-foot"><button class="btn btn-primary" id="kf-simpan" data-testid="faskes-save"><i class="fa fa-save"></i> ' + (edit ? 'Simpan Perubahan' : 'Simpan') + '</button></div></div>';
      ['#kf-tgl', '#kf-nama', '#kf-kond', '#kf-alamat', '#kf-kec'].forEach(function (s) { var n = $(s, host); if (n) n.addEventListener(n.tagName === 'SELECT' ? 'change' : 'input', kotor); });
      $('#kf-nama', host).addEventListener('input', function (e) { v.nama = e.target.value; });
      $('#kf-kond', host).addEventListener('change', function (e) { v.kondisi = e.target.value; });
      $('#kf-alamat', host).addEventListener('input', function (e) { v.alamat = e.target.value; });
      $('#kf-kec', host).addEventListener('input', function (e) { v.kec = e.target.value; });
      if (tinggi && !rha) $('#kf-kab', host).addEventListener('change', function () { kotor(); isiDatalist(); });
      $('#kf-simpan', host).onclick = simpan;
      isiDatalist();
      pasangAutoGrow(host);
    }

    function payloadDari(tgl, kab) {
      if (rha) { var p = faskesPayloadDariRow(row); p.Alamat = v.alamat.trim(); p.Kecamatan = v.kec.trim(); return p; }
      return { Tanggal: tgl, ID_Kabupaten: kab, Nama_Faskes: v.nama.trim(), Kondisi_Faskes: v.kondisi, Alamat: v.alamat.trim(), Kecamatan: v.kec.trim() };
    }
    function cek(tgl, kab) {
      if (rha) return '';   // isian dasar berasal dari RHA dan sudah divalidasi saat diteruskan
      if (!tgl) return 'Kolom wajib belum diisi: Tanggal Kejadian Awal';
      if (tgl > today()) return 'Tanggal Kejadian Awal tidak boleh melewati hari ini.';
      if (tinggi && !kab) return 'Kolom wajib belum diisi: Kabupaten / Kota';
      if (v.nama.trim().length < 3) return 'Kolom wajib belum diisi: Nama Faskes';
      if (!v.kondisi) return 'Kolom wajib belum diisi: Kondisi Faskes';
      return '';
    }
    function selesai(pesan) {
      window.FASKES_KOTOR = false;
      try { localStorage.setItem('indakris_faskes_ping', String(Date.now())); sessionStorage.removeItem('indakris_faskes_tab'); } catch (e) {}
      tampilKonfirmasi(host, {
        pesan: pesan, edit: edit, onTutup: opts.onSelesai || tutupHalaman,
        onLagi: function () { row = null; edit = false; rha = false; req = null; v = { nama: '', kondisi: '', alamat: '', kec: '' }; idkAkun = String((state.user && state.user.idKabupaten) || ''); gambar(); }
      });
    }
    function simpan() {
      var tgl = rha ? String(row.tgl || '').substring(0, 10) : $('#kf-tgl', host).value;
      var kab = rha ? idkAkun : kabAktif();
      var err = cek(tgl, kab);
      if (err) { toast(err, 'fail'); return; }
      var b = $('#kf-simpan', host); b.disabled = true;
      var bukaTombol = function () { var x = $('#kf-simpan', host); if (x) x.disabled = false; };
      var p = payloadDari(tgl, kab);
      if (edit) {
        api('updateFaskesKondisi', getToken(), row.id, p, row.version).then(function (res) {
          if (!res || !res.success) { toast((res && res.message) || 'Gagal menyimpan.', 'fail'); bukaTombol(); return; }
          selesai(res.message);
        });
        return;
      }
      if (!req) req = 'req-' + Date.now() + '-' + Math.random().toString(36).slice(2);   // ID permintaan tetap: kirim ulang tidak menggandakan data
      api('saveFaskesKondisi', getToken(), p, req).then(function (res) {
        if (!res || !res.success) { toast((res && res.message) || 'Gagal menyimpan.', 'fail'); bukaTombol(); return; }
        selesai(res.message);
      });
    }
    mulai();
  }

  function validasiFaskesUI(row, opsi, onDone) {
    confirmDlg('Validasi Data Faskes', 'Validasi data kondisi <b>' + esc(row.nama) + '</b> (' + esc(row.kabupaten) + ')?<br>Sistem memeriksa kelengkapan data lebih dulu. Data yang sudah divalidasi tidak dapat diubah atau dihapus oleh admin biasa.', function () {
      api('validasiFaskesKondisi', getToken(), row.id).then(function (res) {
        if (res.success) { toast(res.message, 'ok'); onDone(); return; }
        if (!res.masalah || !res.masalah.length) { toast(res.message, 'fail'); return; }
        var md = modal({ title: 'Data Belum Dapat Divalidasi', narrow: true });
        md.body.innerHTML = '<div style="line-height:1.6;margin-bottom:8px">' + esc(res.message) + '</div><ul style="margin:0;padding-left:20px;line-height:1.7">' + res.masalah.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>';
        var bTutup = el('<button class="btn btn-ghost">Tutup</button>'); bTutup.onclick = md.close; md.foot.appendChild(bTutup);
        if (row.aksi && row.aksi.edit) {
          var bEdit = el('<button class="btn btn-primary"><i class="fa fa-pen"></i> Perbaiki Data</button>');
          bEdit.onclick = function () { md.close(); if (faskesDariRha(row)) onDone(); else bukaFormFaskes(row, opsi, onDone); };
          md.foot.appendChild(bEdit);
        }
      });
    }, 'Ya, Validasi');
  }

  function detailFaskes(row) {
    var md = modal({ title: 'Detail Faskes (Kondisi) — ' + row.id });
    var kv = [['ID Record', esc(row.id)], ['Status Data', faskesBadge(row.status)]];
    FASKES_KOLOM.forEach(function (c) { var x = row[c[0]]; kv.push([c[1], esc(x === '' || x === null || x === undefined ? '—' : x)]); });
    if (row.sumberRha) kv.push(['Sumber', 'Integrasi Menu RHA (' + esc(row.idKejadian || row.sumberRha) + ')']);
    kv.push(['Dibuat', esc(row.dibuatPada || '—') + (row.dibuatOleh ? ' oleh ' + esc(row.dibuatOleh) : '')]);
    if (row.diverifikasiOleh) kv.push(['Diverifikasi', esc(row.diverifikasiPada || '') + ' oleh ' + esc(row.diverifikasiOleh)]);
    if (row.divalidasiOleh) kv.push(['Divalidasi', esc(row.divalidasiPada || '') + ' oleh ' + esc(row.divalidasiOleh)]);
    md.body.innerHTML = '<dl class="kv">' + kv.map(function (x) { return '<dt>' + esc(x[0]) + '</dt><dd>' + x[1] + '</dd>'; }).join('') + '</dl>';
  }

  // ============ Menu Penilaian Kerusakan Faskes (M03): tabel + formulir di HALAMAN BARU + edit langsung + Verifikasi/Validasi ============
  // Kolom hasil integrasi dari Menu Faskes (Kondisi) (Tanggal, Kabupaten, Nama Faskes, Kondisi, Alamat, Kecamatan) = HANYA BACA.
  // Kolom yang diisi petugas: Pelayanan, Validasi Kerusakan & Kerugian, Lembaga/Instansi yang Validasi, Tanggal Validasi Kerusakan & Kerugian.
  var PNL_KOLOM = [['tgl', 'Tanggal Kejadian Awal'], ['kabupaten', 'Kabupaten'], ['nama', 'Nama Faskes'], ['kondisi', 'Kondisi Faskes'], ['alamat', 'Alamat'], ['kecamatan', 'Kecamatan'],
    ['pelayanan', 'Pelayanan'], ['validasiKK', 'Validasi Kerusakan & Kerugian'], ['lembaga', 'Lembaga/Instansi yang Validasi'], ['tglValidasi', 'Tanggal Validasi Kerusakan & Kerugian']];
  var PNL_EDIT = { pelayanan: 1, validasiKK: 1, lembaga: 1, tglValidasi: 1 };
  var PNL_TEKS_PANJANG = { nama: 1, alamat: 1, kecamatan: 1, validasiKK: 1, lembaga: 1 };
  var PNL_PELAYANAN = ['Full dalam Gedung', 'Sebagian dalam Gedung', 'Dalam & Luar Gedung', 'Full Luar Gedung'];
  var PNL_VALIDASI_KK = ['Sementara Validasi Kerusakan & Kerugian', 'Sudah Validasi Kerusakan', 'Belum Validasi Kerusakan', 'Sudah Validasi Kerugian', 'Belum Validasi Kerugian',
    'Sudah Validasi Kerusakan & Sudah Validasi Kerugian', 'Sudah Validasi Kerusakan & Belum Validasi Kerugian', 'Belum Validasi Kerusakan & Sudah Validasi Kerugian', 'Belum Validasi Kerusakan & Belum Validasi Kerugian'];

  function pnlOpsi(o) { o = o || {}; return { pelayanan: o.pelayanan && o.pelayanan.length ? o.pelayanan : PNL_PELAYANAN, validasi: o.validasi && o.validasi.length ? o.validasi : PNL_VALIDASI_KK }; }
  function pnlStr(x) { return x === null || x === undefined ? '' : String(x); }
  function pnlPayload(v) { return { Pelayanan: pnlStr(v.pelayanan), Validasi_Kerusakan_Kerugian: pnlStr(v.validasiKK), Lembaga_Validasi: pnlStr(v.lembaga).trim(), Tanggal_Validasi: pnlStr(v.tglValidasi).substring(0, 10) }; }
  window.addEventListener('storage', function (e) {
    if (e && e.key === 'indakris_penilaian_ping' && typeof window.PNL_MUAT_ULANG === 'function') window.PNL_MUAT_ULANG();
  });

  function pagePenilaian() {
    var st = state.menuPage.M03 = state.menuPage.M03 || { search: '', dari: '', sampai: '', kab: '', status: '', page: 1, pageSize: 20 };
    var tinggi = state.user.role === 'SUPER_ADMIN' || state.user.role === 'ADMIN_PROVINSI';
    if (!tinggi) st.kab = '';
    var opsi = pnlOpsi(null), byId = {}, lastD = null, editId = null;
    var div = el('<div></div>');
    div.innerHTML = '<div class="page-head"><div><h2 class="page-title" data-testid="page-title">PENILAIAN KERUSAKAN FASKES</h2><div class="page-sub">Informasi Data Krisis Kesehatan NTT</div>' +
      '<div class="scope-line" style="margin-top:6px"><span class="dot"></span>Wilayah aktif <span class="js-wil-pn">' + esc(state.user.idKabupaten || 'Provinsi NTT') + '</span> &nbsp;&bull;&nbsp; <i class="fa fa-clock" style="margin-right:4px"></i>' + nowStr() + '</div></div>' +
      '<div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn btn-export btn-sm" id="pn-pdf"><i class="fa fa-file-pdf"></i> PDF</button>' +
      '<button class="btn btn-export btn-sm" id="pn-xls"><i class="fa fa-file-excel"></i> Excel</button>' +
      '<button class="btn btn-add" id="pn-add" data-testid="add-data-button"><i class="fa fa-plus"></i> Tambah Data</button></div></div>' +
      '<div class="card"><div class="card-pad"><div class="filter-row">' +
      '<div class="field" style="margin:0"><label>Pencarian</label><input id="pn-q" placeholder="Cari nama faskes, kecamatan, pelayanan, lembaga..." value="' + esc(st.search) + '" data-testid="menu-search"></div>' +
      '<div class="field" style="margin:0"><label>Dari Tanggal</label><input type="date" id="pn-dari" value="' + st.dari + '"></div>' +
      '<div class="field" style="margin:0"><label>Sampai Tanggal</label><input type="date" id="pn-sampai" value="' + st.sampai + '"></div>' +
      '<div class="field" style="margin:0"><label>Kabupaten / Kota</label>' + (tinggi ? '<select id="pn-kab"><option value="">Semua Wilayah</option></select>' : '<select id="pn-kab" disabled title="Data dibatasi pada wilayah akun Anda"><option value="">…</option></select>') + '</div>' +
      '<button class="btn btn-primary btn-sm" id="pn-apply" data-testid="apply-filter">Terapkan</button>' +
      '<button class="btn btn-ghost btn-sm" id="pn-reset" data-testid="reset-filter">Reset</button></div>' +
      '<div class="note-info"><i class="fa fa-circle-info"></i><span>Data <b>terisi otomatis dari Menu Faskes (Kondisi)</b>: Tanggal, Kabupaten, Nama Faskes, Kondisi, Alamat, dan Kecamatan hanya baca. Klik <b>Edit</b> untuk melengkapi <b>Pelayanan</b>, <b>Validasi Kerusakan &amp; Kerugian</b>, <b>Lembaga/Instansi</b>, dan <b>Tanggal Validasi</b>.</span></div>' +
      '<div id="pn-tabs" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"></div>' +
      '<div id="pn-body"><div class="empty"><i class="fa fa-spinner fa-spin"></i>Memuat data...</div></div>' +
      '<div class="pager" id="pn-pager"></div></div></div>';

    if (tinggi) {
      api('getKabupatenPublik').then(function (r) {
        var sel = $('#pn-kab', div);
        if (r.success) r.data.kabupaten.forEach(function (k) { sel.appendChild(el('<option value="' + esc(k.id) + '">' + esc(k.nama) + '</option>')); });
        sel.value = st.kab;
      });
    } else {
      namaKab(state.user.idKabupaten, function (n) { $('#pn-kab', div).innerHTML = '<option value="">' + esc(n) + '</option>'; });
    }
    namaKab(state.user.idKabupaten, function (n) { var x = $('.js-wil-pn', div); if (x) x.textContent = n; });

    function celBiasa(c, row) {
      var v = row[c[0]], kosong = (v === '' || v === null || v === undefined);
      var gaya = PNL_TEKS_PANJANG[c[0]] ? ' style="min-width:170px;white-space:normal"' : '';
      var cls = kosong && PNL_EDIT[c[0]] ? ' class="kb-kosong"' : '';
      return '<td' + gaya + cls + '>' + esc(kosong ? '—' : v) + '</td>';
    }
    function celEdit(c, row) {
      var k = c[0], v = pnlStr(row[k]);
      if (k === 'pelayanan') return '<td style="min-width:190px"><select class="kb-ie-sel" data-f="pelayanan">' + opsiKorbanHtml(opsi.pelayanan, v, '-- Pilih --') + '</select></td>';
      if (k === 'validasiKK') return '<td style="min-width:260px"><select class="kb-ie-sel" data-f="validasiKK">' + opsiKorbanHtml(opsi.validasi, v, '-- Pilih --') + '</select></td>';
      if (k === 'tglValidasi') return '<td style="min-width:150px"><input type="date" class="kb-ie-sel" data-f="tglValidasi" max="' + today() + '" value="' + esc(v.substring(0, 10)) + '"></td>';
      return '<td style="min-width:240px;white-space:normal"><textarea class="kb-ie" rows="1" maxlength="1000" data-f="lembaga">' + esc(v) + '</textarea></td>';
    }

    function gambar(d) {
      var b = $('#pn-body', div);
      $('#pn-add', div).style.display = d.izin.tambah ? 'inline-flex' : 'none';
      var tabs = [['', 'Semua (' + d.counts.total + ')'], ['Diajukan', 'Menunggu Verifikasi (' + d.counts.diajukan + ')'], ['Terverifikasi', 'Terverifikasi (' + d.counts.terverifikasi + ')']];
      if (bolehValidasiUI()) tabs.push(['Tervalidasi', 'Tervalidasi (' + d.counts.tervalidasi + ')']);
      $('#pn-tabs', div).innerHTML = tabs.map(function (t) { return '<span class="chip" data-st="' + t[0] + '" style="cursor:pointer;' + (st.status === t[0] ? 'background:var(--primary);color:#fff' : '') + '">' + esc(t[1]) + '</span>'; }).join('');
      Array.prototype.forEach.call($('#pn-tabs', div).querySelectorAll('[data-st]'), function (t) { t.onclick = function () { st.status = t.getAttribute('data-st'); st.page = 1; editId = null; load(); }; });
      if (!d.rows.length && d.total > 0 && st.page > 1) { st.page = Math.max(1, Math.ceil(d.total / st.pageSize)); load(); return; }
      if (!d.rows.length) { b.innerHTML = emptyState('Belum ada data penilaian kerusakan faskes pada lingkup Anda. Data muncul otomatis dari Menu Faskes (Kondisi).'); $('#pn-pager', div).innerHTML = ''; return; }
      byId = {};
      d.rows.forEach(function (x) { byId[x.id] = x; });
      var head = '<th>No</th>' + PNL_KOLOM.map(function (c) { return '<th>' + esc(c[1]) + '</th>'; }).join('') + '<th>Status</th><th>Aksi</th>';
      var body = d.rows.map(function (row, i) {
        var a = row.aksi || {}, editing = editId === row.id && a.edit;
        var tds = PNL_KOLOM.map(function (c) { return (editing && PNL_EDIT[c[0]]) ? celEdit(c, row) : celBiasa(c, row); }).join('');
        var aksi = editing
          ? '<button class="btn btn-primary btn-sm" data-act="simpan" data-testid="penilaian-inline-save"><i class="fa fa-save"></i> Simpan</button><button class="btn btn-ghost btn-sm" data-act="batal">Batal</button>'
          : (a.edit ? '<button class="btn btn-ghost btn-sm" data-act="edit" data-testid="penilaian-edit"><i class="fa fa-pen"></i> Edit</button>' : '') +
            (a.verifikasi && bolehVerifikasiUI() ? '<button class="btn btn-primary btn-sm" data-act="verifikasi" data-testid="penilaian-verifikasi"><i class="fa fa-clipboard-check"></i> Verifikasi</button>' : '') +
            (a.validasi && bolehValidasiUI() ? '<button class="btn btn-primary btn-sm" data-act="validasi" data-testid="penilaian-validasi"><i class="fa fa-circle-check"></i> Validasi</button>' : '') +
            (a.hapus ? '<button class="btn btn-ghost btn-sm" data-act="hapus" data-testid="penilaian-hapus" style="color:#c0392b"><i class="fa fa-trash"></i> Hapus</button>' : '');
        return '<tr data-testid="menu-row" class="rowlink' + (editing ? ' kb-editing' : '') + '" data-id="' + esc(row.id) + '"><td>' + ((d.page - 1) * d.pageSize + i + 1) + '</td>' + tds +
          '<td>' + faskesBadge(row.status) + '</td><td><div style="display:flex;gap:6px;flex-wrap:nowrap">' + aksi + '</div></td></tr>';
      }).join('');
      b.innerHTML = '<div class="table-wrap"><table class="grid" style="min-width:2100px"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>';
      pasangAutoGrow(b);

      var pr = $('#pn-pager', div), pages = Math.max(1, Math.ceil(d.total / d.pageSize));
      pr.innerHTML = '<span class="pager-info">Menampilkan ' + ((d.page - 1) * d.pageSize + 1) + '–' + Math.min(d.page * d.pageSize, d.total) + ' dari ' + fmt(d.total) + ' data</span>' +
        '<button class="pg" ' + (d.page <= 1 ? 'disabled' : '') + ' data-p="prev"><i class="fa fa-chevron-left"></i></button>' +
        Array.from({ length: Math.min(pages, 7) }, function (_, i) { var n = Math.max(1, Math.min(d.page - 3, pages - 6)) + i; return '<button class="pg ' + (n === d.page ? 'active' : '') + '" data-p="' + n + '">' + n + '</button>'; }).join('') +
        '<button class="pg" ' + (d.page >= pages ? 'disabled' : '') + ' data-p="next"><i class="fa fa-chevron-right"></i></button>' +
        '<select class="mini-select" id="pn-ps"><option>20</option><option>50</option><option>100</option></select><span style="color:var(--ink-soft);font-size:12px">data per halaman</span>';
      $('#pn-ps', div).value = String(st.pageSize);
      $('#pn-ps', div).onchange = function () { st.pageSize = Number($('#pn-ps', div).value); st.page = 1; editId = null; load(); };
      Array.prototype.forEach.call(pr.querySelectorAll('[data-p]'), function (btn) { btn.onclick = function () { var v = btn.getAttribute('data-p'); st.page = v === 'prev' ? d.page - 1 : v === 'next' ? d.page + 1 : Number(v); editId = null; load(); }; });

      Array.prototype.forEach.call(b.querySelectorAll('tr[data-id]'), function (tr) {
        tr.onclick = function (e) {
          var row = byId[tr.getAttribute('data-id')];
          if (!row) return;
          var act = e.target.closest('[data-act]');
          if (!act) {
            if (tr.classList.contains('kb-editing') || e.target.closest('textarea,select,input')) return;
            detailPenilaian(row); return;
          }
          var a = act.getAttribute('data-act');
          if (a === 'edit') { editId = row.id; gambar(lastD); var f0 = $('tr.kb-editing [data-f]', b); if (f0) f0.focus(); }   // semua data hasil integrasi: lengkapi langsung di tabel
          else if (a === 'batal') { editId = null; gambar(lastD); }
          else if (a === 'simpan') simpanInline(row, tr, act);
          else if (a === 'verifikasi') confirmDlg('Verifikasi Penilaian Kerusakan', 'Verifikasi penilaian kerusakan <b>' + esc(row.nama) + '</b> (' + esc(row.kabupaten) + ')?<br>Setelah diverifikasi, data dapat divalidasi oleh Admin Provinsi atau Super Admin.', function () {
            api('verifikasiPenilaianKerusakan', getToken(), row.id).then(function (res) { toast(res.message, res.success ? 'ok' : 'fail'); if (res.success) load(); });
          }, 'Ya, Verifikasi');
          else if (a === 'validasi') validasiPenilaianUI(row, load);
          else if (a === 'hapus') confirmDlg('Hapus Data Penilaian', 'Data penilaian <b>' + esc(row.nama) + '</b> (' + esc(row.id) + ') akan dihapus (soft delete) dan tercatat di log audit. Lanjutkan?', function () {
            api('hapusPenilaianKerusakan', getToken(), row.id).then(function (res) { toast(res.message, res.success ? 'ok' : 'fail'); if (res.success) load(); });
          }, 'Hapus');
        };
      });
    }

    function simpanInline(row, tr, btn) {
      var g = function (f) { var n = tr.querySelector('[data-f="' + f + '"]'); return n ? String(n.value || '').trim() : ''; };
      var v = { pelayanan: g('pelayanan'), validasiKK: g('validasiKK'), lembaga: g('lembaga'), tglValidasi: g('tglValidasi') };
      if (v.tglValidasi && v.tglValidasi > today()) { toast('Tanggal Validasi Kerusakan & Kerugian tidak boleh melewati hari ini.', 'fail'); return; }
      btn.disabled = true;
      api('updatePenilaianKerusakan', getToken(), row.id, pnlPayload(v), row.version).then(function (res) {
        btn.disabled = false;
        if (!res.success) { toast(res.message, 'fail'); return; }
        editId = null; toast(res.message, 'ok'); load();
      });
    }

    function load() {
      var p = { search: st.search, dari: st.dari, sampai: st.sampai, idKabupaten: st.kab, status: st.status, page: st.page, pageSize: st.pageSize };
      api('getPenilaianKerusakan', getToken(), p).then(function (r) {
        var b = $('#pn-body', div);
        if (!b) return;
        if (!r.success) { b.innerHTML = emptyState(r.message); return; }
        lastD = r.data; opsi = pnlOpsi(r.data.opsi);
        gambar(lastD);
      });
    }
    window.PNL_MUAT_ULANG = function () { if (document.body.contains(div)) { editId = null; load(); } };

    $('#pn-apply', div).onclick = function () { st.search = $('#pn-q', div).value; st.dari = $('#pn-dari', div).value; st.sampai = $('#pn-sampai', div).value; st.kab = tinggi ? $('#pn-kab', div).value : ''; st.page = 1; editId = null; load(); };
    $('#pn-reset', div).onclick = function () { st.search = ''; st.dari = ''; st.sampai = ''; st.kab = ''; st.status = ''; st.page = 1; editId = null; ['#pn-q', '#pn-dari', '#pn-sampai'].concat(tinggi ? ['#pn-kab'] : []).forEach(function (s) { $(s, div).value = ''; }); load(); };
    $('#pn-q', div).addEventListener('input', debounce(function () { st.search = $('#pn-q', div).value; st.page = 1; editId = null; load(); }, 300));
    $('#pn-add', div).onclick = function () { bukaFormPenilaian(load); };   // Tambah Data dibuka di halaman baru
    $('#pn-xls', div).onclick = function () {
      api('exportPenilaianKerusakan', getToken(), { search: st.search, dari: st.dari, sampai: st.sampai, idKabupaten: st.kab, status: st.status }).then(function (r) {
        if (r.success) { download(r.data.nama, r.data.csv); toast('Berkas Excel (CSV) diunduh.', 'ok'); } else toast(r.message, 'fail');
      });
    };
    $('#pn-pdf', div).onclick = function () { window.print(); };
    load();
    return div;
  }

  // ---------- Formulir Tambah Data Penilaian Kerusakan Faskes di halaman (tab) baru ----------
  function bukaFormPenilaian(onDone) {
    var KEY = 'indakris_handoff';
    try {
      localStorage.setItem(KEY, JSON.stringify({ t: getToken(), u: sessionStorage.getItem('indakris_user'), exp: Date.now() + 120000 }));
      setTimeout(function () { try { localStorage.removeItem(KEY); } catch (e) {} }, 120000);
    } catch (e) {}
    bukaTab('penilaian', 'TDM', function () {
      try { localStorage.removeItem(KEY); } catch (e) {}
      var md = modal({ title: 'Tambah Data Penilaian Kerusakan Faskes' });
      renderFormPenilaian(md.body, { onSelesai: function () { md.close(); if (onDone) onDone(); } });   // cadangan bila tab baru diblokir browser
    }, '');
  }

  // Bagian atas: Tanggal Kejadian Awal + Kabupaten (otomatis dari Faskes (Kondisi), hanya baca).
  // Bagian bawah: Nama Faskes, Kondisi Faskes, Alamat, Kecamatan (otomatis, hanya baca), lalu Pelayanan, Validasi Kerusakan & Kerugian, Lembaga/Instansi, Tanggal Validasi (diisi petugas).
  function renderFormPenilaian(host, opts) {
    var sumber = [], opsi = pnlOpsi(null), req = null, cur = null;
    var v = { idKondisi: '', pelayanan: '', validasiKK: '', lembaga: '', tglValidasi: '' };
    window.PNL_KOTOR = false;
    var kotor = function () { window.PNL_KOTOR = true; };
    var KUNCI = ' <i class="fa fa-lock" title="Terisi otomatis dari Menu Faskes (Kondisi) (hanya baca)" style="font-size:10px;color:var(--ink-soft)"></i>';
    function lbl(t, wajib, kunci) { return esc(t) + (wajib && !kunci ? ' <span class="req">*</span>' : '') + (kunci ? KUNCI : ''); }
    host.innerHTML = '<div class="card" style="padding:20px"><div class="empty"><i class="fa fa-spinner fa-spin"></i>Memuat formulir...</div></div>';

    function mulai() {
      api('getPenilaianSumber', getToken()).then(function (r) {
        if (!r || !r.success) { host.innerHTML = '<div class="card">' + emptyState((r && r.message) || 'Gagal memuat formulir.') + '</div>'; return; }
        sumber = r.data.sumber || []; opsi = pnlOpsi(r.data.opsi);
        gambar();
      });
    }
    function cari(id) { for (var i = 0; i < sumber.length; i++) if (sumber[i].idKondisi === id) return sumber[i]; return null; }
    function labelSumber(s) {
      return pnlStr(s.nama) + ' — ' + pnlStr(s.kabupaten) + ' — ' + pnlStr(s.kondisi || 'Kondisi belum terisi') + ' (' + pnlStr(s.tgl) + ')' + (s.pelayanan || s.validasiKK ? ' ✓' : '');
    }
    function pilihSumber(id) {
      cur = cari(id);
      v.idKondisi = cur ? cur.idKondisi : '';
      v.pelayanan = cur ? pnlStr(cur.pelayanan) : ''; v.validasiKK = cur ? pnlStr(cur.validasiKK) : '';
      v.lembaga = cur ? pnlStr(cur.lembaga) : ''; v.tglValidasi = cur ? pnlStr(cur.tglValidasi) : '';
    }
    function ro(id, nilai, testid, area) {
      var t = pnlStr(nilai);
      return area
        ? '<textarea class="kb-ta" id="' + id + '" rows="1" readonly placeholder="Terisi otomatis" data-testid="' + testid + '">' + esc(t) + '</textarea>'
        : '<input id="' + id + '" readonly placeholder="Terisi otomatis" value="' + esc(t) + '" data-testid="' + testid + '">';
    }

    function gambar() {
      var c = cur || {};
      var blokir = cur && cur.aksi && !cur.aksi.edit && !cur.dihapus;   // mis. sudah Tervalidasi: tidak dapat diubah
      var dis = !cur || blokir ? ' disabled' : '';
      var info = !sumber.length
        ? '<div class="note-info" style="margin-top:0"><i class="fa fa-triangle-exclamation"></i><span>Belum ada data di <b>Menu Faskes (Kondisi)</b> pada lingkup akun Anda. Input data di Menu Faskes (Kondisi) lebih dulu; datanya akan terisi otomatis di sini.</span></div>'
        : '<div class="note-info" style="margin-top:0"><i class="fa fa-link"></i><span>Pilih data faskes dari <b>Menu Faskes (Kondisi)</b>. Isian bertanda <i class="fa fa-lock"></i> terisi otomatis dan hanya baca.</span></div>';
      host.innerHTML = '<div class="card sdm-card"><div class="card-pad">' + info +
        '<div class="field" style="margin-bottom:14px"><label>Data Faskes (Kondisi) <span class="req">*</span></label><select id="pf-src" data-testid="field-ID_Kondisi"' + (sumber.length ? '' : ' disabled') + '>' +
        '<option value="">— Pilih —</option>' + sumber.map(function (s) { return '<option value="' + esc(s.idKondisi) + '"' + (s.idKondisi === v.idKondisi ? ' selected' : '') + '>' + esc(labelSumber(s)) + '</option>'; }).join('') + '</select></div>' +
        (blokir ? '<div class="note-info"><i class="fa fa-lock"></i><span>Data ini sudah <b>Tervalidasi</b> atau di luar kewenangan akun Anda sehingga tidak dapat diubah.</span></div>' : '') +
        '<div class="sdm-sec" style="margin-top:0"><span>Data Kejadian</span></div>' +
        '<div class="form-grid">' +
        '<div class="field"><label>' + lbl('Tanggal Kejadian Awal', 1, 1) + '</label><input type="date" id="pf-tgl" readonly value="' + esc(pnlStr(c.tgl).substring(0, 10)) + '" data-testid="field-Tanggal"></div>' +
        '<div class="field"><label>' + lbl('Kabupaten / Kota', 1, 1) + '</label>' + ro('pf-kab', c.kabupaten, 'field-ID_Kabupaten') + '</div>' +
        '</div>' +
        '<div class="sdm-sec"><span>Data Faskes</span></div>' +
        '<div class="kb-item"><div class="kb-grid">' +
        '<div class="field"><label>' + lbl('Nama Faskes', 1, 1) + '</label>' + ro('pf-nama', c.nama, 'field-Nama_Faskes') + '</div>' +
        '<div class="field"><label>' + lbl('Kondisi Faskes', 1, 1) + '</label>' + ro('pf-kond', c.kondisi, 'field-Kondisi_Faskes') + '</div>' +
        '<div class="field"><label>' + lbl('Alamat', 0, 1) + '</label>' + ro('pf-alamat', c.alamat, 'field-Alamat', 1) + '</div>' +
        '<div class="field"><label>' + lbl('Kecamatan', 0, 1) + '</label>' + ro('pf-kec', c.kecamatan, 'field-Kecamatan', 1) + '</div>' +
        '<div class="field"><label>Pelayanan</label><select id="pf-pel"' + dis + ' data-testid="field-Pelayanan">' + opsiKorbanHtml(opsi.pelayanan, v.pelayanan, '-- Pilih --') + '</select></div>' +
        '<div class="field"><label>Validasi Kerusakan &amp; Kerugian</label><select id="pf-val"' + dis + ' data-testid="field-Validasi_Kerusakan_Kerugian">' + opsiKorbanHtml(opsi.validasi, v.validasiKK, '-- Pilih --') + '</select></div>' +
        '<div class="field"><label>Lembaga/Instansi yang Validasi</label><textarea class="kb-ta" id="pf-lem" rows="1" maxlength="1000"' + dis + ' data-testid="field-Lembaga_Validasi">' + esc(v.lembaga) + '</textarea></div>' +
        '<div class="field"><label>Tanggal Validasi Kerusakan &amp; Kerugian</label><input type="date" id="pf-tv" max="' + today() + '" value="' + esc(pnlStr(v.tglValidasi).substring(0, 10)) + '"' + dis + ' data-testid="field-Tanggal_Validasi"></div>' +
        '</div></div>' +
        '</div><div class="sdm-foot"><button class="btn btn-primary" id="pf-simpan" data-testid="penilaian-save"' + dis + '><i class="fa fa-save"></i> Simpan</button></div></div>';
      $('#pf-src', host).addEventListener('change', function (e) { kotor(); pilihSumber(e.target.value); gambar(); });
      $('#pf-pel', host).addEventListener('change', function (e) { kotor(); v.pelayanan = e.target.value; });
      $('#pf-val', host).addEventListener('change', function (e) { kotor(); v.validasiKK = e.target.value; });
      $('#pf-lem', host).addEventListener('input', function (e) { kotor(); v.lembaga = e.target.value; });
      $('#pf-tv', host).addEventListener('input', function (e) { kotor(); v.tglValidasi = e.target.value; });
      $('#pf-simpan', host).onclick = simpan;
      pasangAutoGrow(host);
    }

    function cek() {
      if (!v.idKondisi) return 'Kolom wajib belum diisi: Data Faskes (Kondisi)';
      if (v.tglValidasi && v.tglValidasi > today()) return 'Tanggal Validasi Kerusakan & Kerugian tidak boleh melewati hari ini.';
      return '';
    }
    function selesai(pesan) {
      window.PNL_KOTOR = false;
      try { localStorage.setItem('indakris_penilaian_ping', String(Date.now())); } catch (e) {}
      tampilKonfirmasi(host, {   // modul konfirmasi: ajak input data baru
        pesan: pesan, edit: false, onTutup: opts.onSelesai || tutupHalaman,
        onLagi: function () { v = { idKondisi: '', pelayanan: '', validasiKK: '', lembaga: '', tglValidasi: '' }; cur = null; req = null; host.innerHTML = '<div class="card" style="padding:20px"><div class="empty"><i class="fa fa-spinner fa-spin"></i>Memuat formulir...</div></div>'; mulai(); }
      });
    }
    function simpan() {
      var err = cek();
      if (err) { toast(err, 'fail'); return; }
      var b = $('#pf-simpan', host); b.disabled = true;
      var bukaTombol = function () { var x = $('#pf-simpan', host); if (x) x.disabled = false; };
      var p = pnlPayload(v); p.ID_Kondisi = v.idKondisi;
      if (!req) req = 'req-' + Date.now() + '-' + Math.random().toString(36).slice(2);   // ID permintaan tetap: kirim ulang tidak menggandakan data
      api('savePenilaianKerusakan', getToken(), p, req).then(function (res) {
        if (!res || !res.success) { toast((res && res.message) || 'Gagal menyimpan.', 'fail'); bukaTombol(); return; }
        selesai(res.message);
      });
    }
    mulai();
  }

  function validasiPenilaianUI(row, onDone) {
    confirmDlg('Validasi Penilaian Kerusakan', 'Validasi penilaian kerusakan <b>' + esc(row.nama) + '</b> (' + esc(row.kabupaten) + ')?<br>Sistem memeriksa kelengkapan data lebih dulu. Data yang sudah divalidasi tidak dapat diubah atau dihapus oleh admin biasa.', function () {
      api('validasiPenilaianKerusakan', getToken(), row.id).then(function (res) {
        if (res.success) { toast(res.message, 'ok'); onDone(); return; }
        if (!res.masalah || !res.masalah.length) { toast(res.message, 'fail'); return; }
        var md = modal({ title: 'Data Belum Dapat Divalidasi', narrow: true });
        md.body.innerHTML = '<div style="line-height:1.6;margin-bottom:8px">' + esc(res.message) + '</div><ul style="margin:0;padding-left:20px;line-height:1.7">' + res.masalah.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>';
        var bTutup = el('<button class="btn btn-ghost">Tutup</button>'); bTutup.onclick = md.close; md.foot.appendChild(bTutup);
        if (row.aksi && row.aksi.edit) {
          var bEdit = el('<button class="btn btn-primary"><i class="fa fa-pen"></i> Lengkapi Data</button>');
          bEdit.onclick = function () { md.close(); onDone(); };   // kembali ke tabel; klik Edit untuk melengkapi di tabel
          md.foot.appendChild(bEdit);
        }
      });
    }, 'Ya, Validasi');
  }

  function detailPenilaian(row) {
    var md = modal({ title: 'Detail Penilaian Kerusakan Faskes — ' + row.id });
    var kv = [['ID Record', esc(row.id)], ['Status Data', faskesBadge(row.status)]];
    PNL_KOLOM.forEach(function (c) { var x = row[c[0]]; kv.push([c[1], esc(x === '' || x === null || x === undefined ? '—' : x)]); });
    if (row.idKondisi) kv.push(['Sumber', 'Integrasi Menu Faskes (Kondisi) (' + esc(row.idKondisi) + ')']);
    kv.push(['Dibuat', esc(row.dibuatPada || '—') + (row.dibuatOleh ? ' oleh ' + esc(row.dibuatOleh) : '')]);
    if (row.diverifikasiOleh) kv.push(['Diverifikasi', esc(row.diverifikasiPada || '') + ' oleh ' + esc(row.diverifikasiOleh)]);
    if (row.divalidasiOleh) kv.push(['Divalidasi', esc(row.divalidasiPada || '') + ' oleh ' + esc(row.divalidasiOleh)]);
    md.body.innerHTML = '<dl class="kv">' + kv.map(function (x) { return '<dt>' + esc(x[0]) + '</dt><dd>' + x[1] + '</dd>'; }).join('') + '</dl>';
  }

  // ============ Menu Perkembangan Korban (M26): tabel + formulir di HALAMAN BARU + edit langsung data hasil integrasi ============
  // Urutan kolom tabel = urutan isian pada formulir Tambah Data.
  var PKB_KOLOM = [['tgl', 'Tanggal Kejadian Awal'], ['kabupaten', 'Kabupaten'], ['nama', 'Nama'], ['jk', 'Jenis Kelamin'], ['usia', 'Usia'], ['kategori', 'Kategori Usia'],
    ['statusAwal', 'Status Awal'], ['diagnosa', 'Diagnosa/Keterangan'], ['alamat', 'Alamat'], ['kecamatan', 'Kecamatan'], ['lokasiKejadian', 'Lokasi Kejadian'],
    ['lokasiPerawatan', 'Lokasi Perawatan'], ['rujukan', 'Rujukan'], ['wn', 'Kewarganegaraan'], ['statusLanjutan', 'Status Lanjutan'], ['tglLanjutan', 'Tanggal Sembuh/Rujuk/Meninggal']];
  var PKB_STATUS = ['Rawat Inap', 'Rawat Jalan', 'Dirujuk', 'Sembuh', 'Meninggal', 'Ditemukan Hidup', 'Masih Hilang'];
  var PKB_WAJIB_TGL = ['Sembuh', 'Dirujuk', 'Meninggal'];
  var PKB_TEKS_PANJANG = { alamat: 1, lokasiKejadian: 1, diagnosa: 1, lokasiPerawatan: 1, kecamatan: 1 };

  var PKB_ISI = { diagnosa: ['Diagnosa', 500, 'ta'], kecamatan: ['Kecamatan', 100, 'ta'], lokasiKejadian: ['Lokasi_Kejadian', 300, 'ta'],
    lokasiPerawatan: ['Lokasi_Perawatan', 200, 'ta'], rujukan: ['Rujukan', 0, 'sel'], wn: ['Kewarganegaraan', 0, 'sel'] };

  function pkbKosong(v) { return v === '' || v === null || v === undefined; }
  function pkbAutoGrow(root) {

  function pkbBadge(s) {

    return '<span class="badge ' + (warna[s] || 'badge-draft') + '">' + esc(s) + '</span>';
